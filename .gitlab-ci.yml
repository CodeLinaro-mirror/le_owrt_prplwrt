variables:
  CI_DESIGNATED_BRANCH: prplos

include:
  - local: .gitlab/cdrouter.yml
  - local: .gitlab/testbed.yml
  - local: .gitlab/testbed/glinet-b1300.yml

stages:
  - run
  - cdrouter

run test Gl.iNet B1300 initramfs:
  needs:
    - build test ipq40xx prpl
  extends: .glinet-b1300 testbed

CDRouter-Top-100 Gl.iNet initramfs:
  needs:
    - build test ipq40xx prpl
  extends:
    - .glinet-b1300 testbed
    - .cdrouter

CDRouter-Top-100 Gl.iNet VLAN WAN/LAN initramfs:
  needs:
    - build test ipq40xx prpl
  extends:
    - .glinet-b1300 testbed
    - .cdrouter
  variables:
    CDROUTER_TEST_CONFIG: vlan
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-enable-vlans.sh

CDRouter-Top-100 Gl.iNet PPPoE WAN initramfs:
  needs:
    - build test ipq40xx prpl
  extends:
    - .glinet-b1300 testbed
    - .cdrouter
  variables:
    CDROUTER_TEST_CONFIG: ppp
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-enable-pppoe.sh

CDRouter-IPv6-Top-100 Gl.iNet initramfs:
  allow_failure: true
  rules:
    - when: manual
  variables:
    CDROUTER_TEST_CONFIG: generic-ipv6
  needs:
    - build test ipq40xx prpl
  extends:
    - .glinet-b1300 testbed
    - .cdrouter

CDRouter-IPv6-Top-100 Gl.iNet VLAN WAN/LAN initramfs:
  allow_failure: true
  rules:
    - when: manual
  needs:
    - build test ipq40xx prpl
  extends:
    - .glinet-b1300 testbed
    - .cdrouter
  variables:
    CDROUTER_TEST_CONFIG: vlan-ipv6
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-enable-vlans.sh

CDRouter-IPv6-Top-100 Gl.iNet PPPoE WAN initramfs:
  allow_failure: true
  rules:
    - when: manual
  needs:
    - build test ipq40xx prpl
  extends:
    - .glinet-b1300 testbed
    - .cdrouter
  variables:
    CDROUTER_TEST_CONFIG: ppp-ipv6
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-enable-pppoe.sh
