variables:
  CI_DESIGNATED_BRANCH: prplos

include:
  - local: .gitlab/build.yml
  - local: .gitlab/cdrouter.yml
  - local: .gitlab/cdrouter/wnc-freedom.yml
  - local: .gitlab/cdrouter/urx851-hdk-3.yml
  - local: .gitlab/docker.yml
  - local: .gitlab/docker/builder/gitlab.yml
  - local: .gitlab/docker/testbed/gitlab.yml
  - local: .gitlab/testbed.yml
  - local: .gitlab/testbed/wnc-freedom.yml
  - local: .gitlab/testbed/urx851-hdk-3.yml

stages:
  - docker
  - docker test
  - docker deploy
  - build
  - release
  - docker SDK and IB
  - docker SDK and IB test
  - docker SDK and IB deploy
  - docker IB LCM container
  - run
  - cdrouter
  - coverity

build test qca_ipq95xx prpl security:
  extends: .build test config

run test Freedom initramfs:
  needs:
    - job: build test qca_ipq95xx prpl security
      optional: true
  extends: .wnc-freedom testbed

build test mxl_x86_osp_tb341 mxl_wlan_hostap_ng prpl security:
  image: registry.gitlab.com/prpl-foundation/prplos/prplos/prplos-nightly/builder-osp@sha256:081488878a834952dbfd223f90dba987052082019f5816a0798f72bc4b3a95a1
  extends: .build test config
  artifacts:
  tags:
    - firmware-builder-osp
  rules:
    - when: manual

run test URX851-HDK-3 with system on eMMC:
  needs:
    - job: build test mxl_x86_osp_tb341 mxl_wlan_hostap_ng prpl security
      optional: true
  extends: .urx851-hdk-3 testbed
