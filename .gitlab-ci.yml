      b111c329a4fafb33a4fe258e9d6f92c5115604c89b77f827963d8adc780be350  bin/targets/intel_x86/lgm/prplos-intel_x86-lgm-PRPL_OSP_v2-wgrtd159be_b_wav700-ext4.img
    PREBUILT_FIRMWARE_JOB_ID: "15410650125"
