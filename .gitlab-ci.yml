# Prepared by AI Codex for CI-69.
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "codex/ci-69-nptv6-prefix-ref" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'
    - when: never

include:
  - local: .gitlab/testbed/qemu-x86-64.yml

variables:
  CI69_TESTBED_IMAGE: "registry.gitlab.com/prpl-foundation/prplos/ci/containers/testbed-qemu@sha256:c7bc9592304871ebffb21f8510f7f086ef11602d39c0500fd47038ace43f2f53"
  CI69_FIRMWARE_URL: "http://45.13.226.75:18080/7139cb1a98e1/prplos-x86-64-generic-squashfs-combined-efi.img.gz"
  CI69_FIRMWARE_SHA256: "7139cb1a98e14c35e5d216e07e2ca55041e5850e7c83ed14a65fbe7b9f0a3dfd"

stages: [prepare, run]

fetch QEMU firmware:
  stage: prepare
  image: "$CI69_TESTBED_IMAGE"
  tags: [qemu-amd64]
  variables:
    TESTBED_QEMU_IMAGE: bin/targets/x86/64/prplos-x86-64-generic-squashfs-combined-efi.img
  script:
    - mkdir -p "$(dirname "$TESTBED_QEMU_IMAGE")"
    - >
      curl --fail --location --show-error --connect-timeout 20 --max-time 900
      --retry 2 --retry-delay 5
      "$CI69_FIRMWARE_URL" --output "$TESTBED_QEMU_IMAGE.gz"
    - printf '%s  %s\n' "$CI69_FIRMWARE_SHA256" "$TESTBED_QEMU_IMAGE.gz" | sha256sum --check --strict
    - gzip -dc "$TESTBED_QEMU_IMAGE.gz" > "$TESTBED_QEMU_IMAGE"
    - rm "$TESTBED_QEMU_IMAGE.gz"
    - sha256sum "$TESTBED_QEMU_IMAGE" > "${TESTBED_QEMU_IMAGE}.sha256"
  artifacts:
    expire_in: 1 week
    paths:
      - bin/targets/x86/64/

cram QEMU x86-64 [IPv6]:
  extends: .qemu-x86-64 testbed
  image: "$CI69_TESTBED_IMAGE"
  needs: ["fetch QEMU firmware"]
  timeout: 60 minutes
  rules:
    - when: on_success
  variables:
    CRAM_TEST_SUITE: .gitlab/tests/cram/ci69
    CRAM_TEST_SUITE_POST: ""
  artifacts:
    reports:
      junit: artifacts/cram.xml
