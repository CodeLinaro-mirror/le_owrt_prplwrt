variables:
  CI_DESIGNATED_BRANCH: prplos

include:
  - local: .gitlab/cdrouter.yml
  - local: .gitlab/testbed.yml
  - local: .gitlab/testbed/glinet-b1300.yml

stages:
  - cdrouter

CDRouter-IPv6-Top-100+mDNS Gl.iNet VLAN WAN/LAN initramfs:
  rules:
    - when: always
  extends:
    - .glinet-b1300 testbed
    - .cdrouter
  variables:
    CDROUTER_TEST_CONFIG: vlan-ipv6
    TFTP_IMAGE_DOWNLOAD_URL: http://kashyyyk.mooo.com/fw/openwrt-ipq40xx-generic-glinet_gl-b1300-squashfs-sysupgrade.bin
    TFTP_IMAGE_FILENAME: openwrt-ipq40xx-generic-glinet_gl-b1300-squashfs-sysupgrade.bin
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-enable-vlans.sh

