# Throwaway CI verification commit, never merged. The pipeline holds only two
# manual Freedom cram jobs, one per testbed, that reuse prebuilt firmware.
include:
  - local: .gitlab/dut-lifecycle.yml
  - local: .gitlab/testbed.yml
  - local: .gitlab/testbed/wnc-freedom.yml

stages:
  - run

.cram Freedom [full] prebuilt:
  extends: .wnc-freedom testbed
  needs: []
  timeout: 94 minutes
  variables:
    COMPONENT: full
  rules:
    - when: manual
      allow_failure: true
  before_script:
    - |
      curl --fail --location --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --output artifacts.zip \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/17624584241/artifacts"
    - |
      python3 -c "import zipfile; z = zipfile.ZipFile('artifacts.zip'); \
      z.extractall(members=[n for n in z.namelist() if n.startswith('bin/')])"
    - rm -f artifacts.zip
    - !reference [.testbed, before_script]

cram Freedom [full] testbed-03:
  extends: .cram Freedom [full] prebuilt
  tags:
    - freedom-tb03

cram Freedom [full] testbed-04:
  extends: .cram Freedom [full] prebuilt
  tags:
    - freedom-tb04

lint cram component manifest:
  rules:
    - when: never
