# Disable the builder/testbed docker chains in full: their test/deploy jobs
# need the build job, so dropping only the build job leaves a dangling need
# that fails pipeline creation.
"build Docker image builder": { rules: [{ when: never }] }
"test Docker image builder": { rules: [{ when: never }] }
"deploy Docker image builder": { rules: [{ when: never }] }
"build Docker image testbed": { rules: [{ when: never }] }
"test Docker image testbed": { rules: [{ when: never }] }
"deploy Docker image testbed": { rules: [{ when: never }] }
