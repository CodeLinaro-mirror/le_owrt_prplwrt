variables:
  CI_DESIGNATED_BRANCH: prpl/nightly
  CI_DESIGNATED_BRANCH_SLUG: prpl-nightly

include:
  - local: .gitlab/build.yml
  - local: .gitlab/blackduck.yml
  - local: .gitlab/release.yml
  - local: .gitlab/cdrouter.yml
  - local: .gitlab/prplmesh.yml
  - local: .gitlab/cdrouter/prpl-haze.yml
  - local: .gitlab/cdrouter/turris-omnia.yml
  - local: .gitlab/cdrouter/mxl25641-hdk-6.yml
  - local: .gitlab/cdrouter/arcadyan-mozart.yml
  - local: .gitlab/cdrouter/wnc-freedom.yml
  - local: .gitlab/coverity.yml
  - local: .gitlab/docker.yml
  - local: .gitlab/docker/builder/gitlab.yml
  - local: .gitlab/docker/testbed/gitlab.yml
  - local: .gitlab/docker/sdk/gitlab.yml
  - local: .gitlab/docker/ib/gitlab.yml
  - local: .gitlab/docker/ib/lcm/gitlab.yml
  - local: .gitlab/testbed.yml
  - local: .gitlab/testbed/prpl-haze.yml
  - local: .gitlab/testbed/turris-omnia.yml
  - local: .gitlab/testbed/mxl25641-hdk-6.yml
  - local: .gitlab/testbed/arcadyan-mozart.yml
  - local: .gitlab/testbed/wnc-freedom.yml

stages:
  - docker
  - docker test
  - docker deploy
  - build
  - release
  - docker SDK and IB
  - docker SDK and IB test
  - docker SDK and IB deploy
  - docker IB LCM container
  - run
  - smoke tests
  - certification tests
  - cdrouter
  - coverity
  - blackduck

build test mxl_x86_osp_tb341_v2 mxl_wlan_hostap_ng_wav700 prpl cellular security thread:
  extends: .build test config

build test mvebu prpl security:
  extends: .build test config

build test x86_64 prpl security:
  extends: .build test config

build test ipq807x prpl security:
  extends: .build test config

build test mtk_filogic prpl security:
  extends: .build test config

build test qca_ipq95xx prpl cellular security thread:
  extends: .build test config

build test qca_ipq95xx extender_minimal cellular security thread:
  extends: .build test config

build test qca_ipq95xx extender_full cellular security thread:
  extends: .build test config

coverity scan qca_ipq95xx prpl extender_full cellular thread:
  extends: .coverity scan config
  variables:
    CI_COVERITY_COMPILER_TEMPLATE_LIST: >
      aarch64-openwrt-linux-gcc
      aarch64-openwrt-linux-musl-gcc

blackduck scan mxl_x86_osp_tb341_v2 mxl_wlan_hostap_ng_wav700 prpl extender_full cellular security thread:
  extends: .blackduck scan config

blackduck scan qca_ipq95xx prpl extender_full cellular security thread:
  extends: .blackduck scan config

run test Turris Omnia initramfs:
  allow_failure: true
  needs: ["build test mvebu prpl security"]
  extends: .turris-omnia testbed
  rules: [{ when: never }]  # WIP: out of scope for the prebuilt OSPv2+Freedom run

run test Haze initramfs:
  allow_failure: true
  needs: ["build test ipq807x prpl security"]
  extends: .prpl-haze testbed
  rules: [{ when: never }]  # WIP: out of scope for the prebuilt OSPv2+Freedom run

run test MXL25641-HDK-6 with system on eMMC:
  needs: []  # WIP: prebuilt firmware, no build dependency; drop with WIP commit
  extends: .mxl25641-hdk-6 testbed

run test Freedom with system on eMMC:
  needs: []  # WIP: prebuilt firmware, no build dependency; drop with WIP commit
  extends: .wnc-freedom testbed

run test Mozart initramfs:
  needs:
    - job: build test mtk_filogic prpl security
      optional: true
  extends: .arcadyan-mozart testbed
  rules: [{ when: never }]  # WIP: out of scope for the prebuilt OSPv2+Freedom run

# WIP: tailored pipeline for the FEAT-29 update_prpl flash flow (prplos!1964)
# on the Freedom + OSPv2 testbeds only, from prebuilt images (no local build).
# These cdrouter jobs default to `manual` on a feature branch; flip the OSPv2 +
# Freedom functional suite to on_success and drop their build dependency so they
# run off the prebuilt firmware fetched in the .cdrouter before_script. Heavy
# cert/failing/USP-prpl jobs are deliberately left at their manual default.
# All other boards/builds stay manual and do not run. Drop this whole block,
# the two run-test `needs: []` overrides, the PREBUILT_* vars and the prebuilt
# curl in .gitlab/{testbed,cdrouter}.yml before merge.
"CDRouter-Top-100+mDNS-OSP MXL25641-HDK-6 eMMC": { needs: [], rules: [{ when: on_success }] }
"CDRouter-Top-100+mDNS-OSP MXL25641-HDK-6 VLAN WAN/LAN eMMC": { needs: [], rules: [{ when: on_success }] }
"CDRouter-Top-100+mDNS-OSP MXL25641-HDK-6 PPPoE WAN eMMC": { needs: [], rules: [{ when: on_success }] }
"CDRouter-Wireless MXL25641-HDK-6 eMMC": { needs: [], rules: [{ when: on_success }] }
"CDRouter-UPnP-IPv46 MXL25641-HDK-6 eMMC": { needs: [], rules: [{ when: on_success }] }
"CDRouter-IPv6-Top-100+mDNS MXL25641-HDK-6 eMMC": { needs: [], rules: [{ when: on_success }] }
"CDRouter-IPv6-Top-100+mDNS MXL25641-HDK-6 VLAN WAN/LAN eMMC": { needs: [], rules: [{ when: on_success }] }
"CDRouter-TR-069 MXL25641-HDK-6 eMMC": { needs: [], rules: [{ when: on_success }] }
"prplWare-Smoke-Test-Suite MXL25641-HDK-6 eMMC": { needs: [], rules: [{ when: on_success }] }
"CDRouter-Top-100+mDNS Freedom eMMC": { needs: [], rules: [{ when: on_success }] }
"CDRouter-Top-100+mDNS Freedom VLAN WAN/LAN eMMC": { needs: [], rules: [{ when: on_success }] }
"CDRouter-Top-100+mDNS Freedom PPPoE WAN eMMC": { needs: [], rules: [{ when: on_success }] }
"CDRouter-Wireless Freedom eMMC": { needs: [], rules: [{ when: on_success }] }
"CDRouter-UPnP-IPv46 Freedom eMMC": { needs: [], rules: [{ when: on_success }] }
"CDRouter-IPv6-Top-100+mDNS Freedom eMMC": { needs: [], rules: [{ when: on_success }] }
"CDRouter-IPv6-Top-100+mDNS Freedom VLAN WAN/LAN eMMC": { needs: [], rules: [{ when: on_success }] }
"CDRouter-TR-069 Freedom eMMC": { needs: [], rules: [{ when: on_success }] }
"prplWare-Smoke-Test-Suite Freedom eMMC": { needs: [], rules: [{ when: on_success }] }

# WIP: trim everything else out of the pipeline (weekly-CI style) so only the
# OSPv2 + Freedom functional suite above remains. Builds are disabled at the
# .build test config template (inherited via extends); the rest are per-job
# rules overrides that deep-merge over the included definitions. Drop with the
# WIP commit.
