variables:
  CI_DESIGNATED_BRANCH: prpl/nightly
  CI_DESIGNATED_BRANCH_SLUG: prpl-nightly
  PFD_PIPELINE_ID: "2686553123"
  PFD_BINARY_URL: "https://gitlab.com/ynezz/prplos-ci-build-artifacts/-/jobs/13116912273/artifacts/raw/pfd-linux-amd64"
  PFD_BINARY_SHA256: "e3e987b9b556bba1caa04ec61ef5e98e6fa420caf656eac4fc621c37287646eb"

include:
  - local: .gitlab/cdrouter.yml
  - local: .gitlab/cdrouter/wnc-freedom.yml
  - local: .gitlab/testbed.yml
  - local: .gitlab/testbed/mxl25641-hdk-6.yml
  - local: .gitlab/testbed/wnc-freedom.yml

stages:
  - run
  - smoke tests

.focused prebuilt firmware:
  before_script:
    - export XDG_CONFIG_HOME="/tmp/testbed-config-$CI_JOB_ID"
    - sudo chown "$(id -u):$(id -g)" "$HOME"
    - mkdir -p "$XDG_CONFIG_HOME/pfd" "$TFTP_IMAGE_PATH"
    - curl --fail --location --silent --show-error --output ./pfd "$PFD_BINARY_URL"
    - echo "$PFD_BINARY_SHA256  ./pfd" | sha256sum --check --strict
    - chmod +x ./pfd
    - install -m 0644 .pfd/devices.yaml "$XDG_CONFIG_HOME/pfd/devices.yaml"
    - |
      for image_type in $PFD_IMAGE_TYPES; do
        ./pfd get "$DUT_BOARD" \
          --project prpl-foundation/prplos/prplos \
          --pipeline "$PFD_PIPELINE_ID" \
          --type "$image_type" --no-cache \
          --output "$TFTP_IMAGE_PATH/"
      done
    - echo "$PFD_FIRMWARE_SHA256S" | sha256sum --check --strict
    - |
      if [ -n "${PREBUILT_FIRMWARE_JOB_ID:-}" ]; then
        prebuilt_artifacts_zip="$(mktemp)"
        curl --fail --location --silent --show-error \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --output "$prebuilt_artifacts_zip" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/$PREBUILT_FIRMWARE_JOB_ID/artifacts"
        echo "$PREBUILT_ARTIFACT_SHA256  $prebuilt_artifacts_zip" \
          | sha256sum --check --strict

        PREBUILT_ARTIFACTS_ZIP="$prebuilt_artifacts_zip" python3 - <<'PY'
      import os
      import sys
      import zipfile

      archive = os.environ["PREBUILT_ARTIFACTS_ZIP"]
      destination = os.environ["CI_PROJECT_DIR"]
      prefix = f'{os.environ["DUT_ARCH_PACKAGES_PATH"]}/feed_prplos/'
      extra_artifacts = [
          line.split(maxsplit=1)[1]
          for line in os.environ.get("PREBUILT_EXTRA_ARTIFACT_SHA256S", "").splitlines()
          if line.strip()
      ]
      extracted = 0

      with zipfile.ZipFile(archive) as artifacts:
          for member in artifacts.infolist():
              if member.filename.startswith(prefix):
                  artifacts.extract(member, destination)
                  extracted += 1
          for artifact in extra_artifacts:
              try:
                  artifacts.extract(artifact, destination)
              except KeyError:
                  sys.exit(f"Missing {artifact} in prebuilt artifacts")

      if extracted == 0:
          sys.exit(f"Missing {prefix} packages in prebuilt artifacts")

      print(f"Extracted {extracted} package artifacts from {prefix}")
      print(f"Extracted {len(extra_artifacts)} extra artifacts")
      PY

        if [ -n "${PREBUILT_EXTRA_ARTIFACT_SHA256S:-}" ]; then
          echo "$PREBUILT_EXTRA_ARTIFACT_SHA256S" | sha256sum --check --strict
        fi
        rm -f "$prebuilt_artifacts_zip"
      fi

