variables:
  CI_DESIGNATED_BRANCH: prplwrt-19.07

include:
  - local: .gitlab/build.yml
  - local: .gitlab/cdrouter.yml
  - local: .gitlab/docker.yml
  - local: .gitlab/docker/builder/gitlab.yml
  - local: .gitlab/docker/testbed/gitlab.yml
  - local: .gitlab/docker/sdk/gitlab.yml
  - local: .gitlab/testbed.yml
  - local: .gitlab/testbed/nec-wx3000hp.yml
  - local: .gitlab/testbed/glinet-b1300.yml
  - local: .gitlab/testbed/turris-omnia.yml

stages:
  - docker
  - docker test
  - docker deploy
  - build
  - docker SDK
  - docker SDK test
  - docker SDK deploy
  - run
  - cdrouter

build test intel_mips prpl:
  extends: .build test config

build test ipq40xx prpl:
  extends: .build test config

build test mvebu prpl:
  extends: .build test config

run test NEC WX3000HP NAND:
  needs:
    - build test intel_mips prpl
  extends: .nec-wx3000hp testbed

run test Gl.iNet B1300 initramfs:
  needs:
    - build test ipq40xx prpl
  extends: .glinet-b1300 testbed

run test Turris Omnia initramfs:
  needs:
    - build test mvebu prpl
  extends: .turris-omnia testbed

CDRouter-Top-100 NEC NAND:
  needs:
    - build test intel_mips prpl
  extends:
    - .nec-wx3000hp testbed
    - .cdrouter

CDRouter-Top-100 Gl.iNet initramfs:
  needs:
    - build test ipq40xx prpl
  extends:
    - .glinet-b1300 testbed
    - .cdrouter

CDRouter-Top-100 Turris initramfs:
  needs:
    - build test mvebu prpl
  extends:
    - .turris-omnia testbed
    - .cdrouter

CDRouter-Top-100 NEC VLAN WAN/LAN NAND:
  needs:
    - build test intel_mips prpl
  extends:
    - .nec-wx3000hp testbed
    - .cdrouter
  variables:
    CDROUTER_TEST_CONFIG: vlan
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-enable-vlans.sh

CDRouter-Top-100 Gl.iNet VLAN WAN/LAN initramfs:
  needs:
    - build test ipq40xx prpl
  extends:
    - .glinet-b1300 testbed
    - .cdrouter
  variables:
    CDROUTER_TEST_CONFIG: vlan
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-enable-vlans.sh

CDRouter-Top-100 Turris VLAN WAN/LAN initramfs:
  needs:
    - build test mvebu prpl
  extends:
    - .turris-omnia testbed
    - .cdrouter
  variables:
    CDROUTER_TEST_CONFIG: vlan
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-enable-vlans.sh

CDRouter-Top-100 NEC PPPoE WAN NAND:
  needs:
    - build test intel_mips prpl
  extends:
    - .nec-wx3000hp testbed
    - .cdrouter
  variables:
    CDROUTER_TEST_CONFIG: ppp
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-enable-pppoe.sh

CDRouter-Top-100 Gl.iNet PPPoE WAN initramfs:
  needs:
    - build test ipq40xx prpl
  extends:
    - .glinet-b1300 testbed
    - .cdrouter
  variables:
    CDROUTER_TEST_CONFIG: ppp
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-enable-pppoe.sh

