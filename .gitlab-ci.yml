variables:
  CI_DESIGNATED_BRANCH: prpl/nightly
  CI_DESIGNATED_BRANCH_SLUG: prpl-nightly
  PFD_PIPELINE_ID: "2697816458"
  PFD_BINARY_URL: "https://gitlab.com/ynezz/prplos-ci-build-artifacts/-/jobs/13116912273/artifacts/raw/pfd-linux-amd64"
  PFD_BINARY_SHA256: "e3e987b9b556bba1caa04ec61ef5e98e6fa420caf656eac4fc621c37287646eb"

include:
  - local: .gitlab/testbed.yml
  - local: .gitlab/testbed/wnc-freedom.yml

stages:
  - run
  - smoke tests

lint cram component manifest:
  rules:
    - when: never

.focused prebuilt firmware:
  before_script:
    - mkdir -p ~/.config/pfd "$TFTP_IMAGE_PATH"
    - curl --fail --location --silent --show-error --output ./pfd "$PFD_BINARY_URL"
    - echo "$PFD_BINARY_SHA256  ./pfd" | sha256sum --check --strict
    - chmod +x ./pfd
    - install -m 0644 .pfd/devices.yaml ~/.config/pfd/devices.yaml
    - |
      for image_type in $PFD_IMAGE_TYPES; do
        ./pfd get "$DUT_BOARD" \
          --project prpl-foundation/prplos/prplos \
          --pipeline "$PFD_PIPELINE_ID" \
          --type "$image_type" --no-cache \
          --output "$TFTP_IMAGE_PATH/"
      done
    - echo "$PFD_FIRMWARE_SHA256S" | sha256sum --check --strict

.focused Freedom inputs:
  variables:
    PFD_IMAGE_TYPES: emmc bootstack
    PFD_FIRMWARE_SHA256S: |
      21336a8d420ac0f6432d07a40fd77e9fb8794c881da2c2ce5af8aa585af660d5  bin/targets/ipq95xx/generic/prplos-ipq95xx-generic-prpl_freedom-update_script.itb
      c2f5683b15a55297c8b4bb92600a960088a4f984978978249ea46f87c72a79f5  bin/targets/ipq95xx/generic/prplos-ipq95xx-generic-prpl_freedom-kernel.itb
      bb4fa820da9c826d1f51c4a22d9bd500a6a518d11e10642309bf616a89b50ad6  bin/targets/ipq95xx/generic/prplos-ipq95xx-generic-prpl_freedom-rootfs.itb

cram Freedom [py314-preflight]:
  extends:
    - .wnc-freedom testbed
    - .focused prebuilt firmware
    - .focused Freedom inputs
  needs: []
  tags:
    - dut-wnc-freedom-sfl-prio
  rules:
    - when: on_success
  variables:
    CRAM_TEST_SUITE: |
      .gitlab/tests/cram/generic/busybox.t
      .gitlab/tests/cram/generic/sysregister.t
      .gitlab/tests/cram/py314-suite-size-probe.t
  before_script:
    - !reference [.focused prebuilt firmware, before_script]
    - !reference [.testbed, before_script]
  script:
    - !reference [.testbed, script]
