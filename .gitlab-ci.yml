  allow_failure: true
  rules:
    - when: manual
  needs:
    - build test mvebu prpl
  extends:
    - .turris-omnia testbed
    - .cdrouter
  variables:
    CDROUTER_TEST_CONFIG: vlan-ipv6
    DUT_INIT_SCRIPTS: |
