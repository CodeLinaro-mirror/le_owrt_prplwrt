variables:
  CI_DESIGNATED_BRANCH: prpl/nightly
  CI_DESIGNATED_BRANCH_SLUG: prpl-nightly

include:
  - local: .gitlab/testbed.yml
  - local: .gitlab/testbed/wnc-freedom.yml

stages:
  - run
  - smoke tests

lint cram component manifest:
  rules:
    - when: never

.focused prebuilt Freedom firmware:
  variables:
    PREBUILT_FIRMWARE_JOB_ID: "15470703394"
    PREBUILT_ARTIFACT_SHA256: "8d2ddd92aace63cc68359fa3eb6f06e0de0ad9b9b48f82b69bbd854cf53435b5"
    PFD_FIRMWARE_SHA256S: |
      21336a8d420ac0f6432d07a40fd77e9fb8794c881da2c2ce5af8aa585af660d5  bin/targets/ipq95xx/generic/prplos-ipq95xx-generic-prpl_freedom-update_script.itb
      cd672bcc1786c938d8482823f671e5bdab9e70e281fb63f4b5b708aa577f2cad  bin/targets/ipq95xx/generic/prplos-ipq95xx-generic-prpl_freedom-kernel.itb
      589b3a4662da59926b77bd5ac80d7d4f740c1a8bb71357158f8fd5ab6fc171f0  bin/targets/ipq95xx/generic/prplos-ipq95xx-generic-prpl_freedom-rootfs.itb
  before_script:
    - mkdir -p "$TFTP_IMAGE_PATH"
    - |
      prebuilt_artifacts_zip="$(mktemp)"
      curl --fail --location --silent --show-error \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --output "$prebuilt_artifacts_zip" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/$PREBUILT_FIRMWARE_JOB_ID/artifacts"
      echo "$PREBUILT_ARTIFACT_SHA256  $prebuilt_artifacts_zip" \
        | sha256sum --check --strict
    - |
      PREBUILT_ARTIFACTS_ZIP="$prebuilt_artifacts_zip" python3 - <<'PY'
      import os
      import sys
      import zipfile

      archive = os.environ["PREBUILT_ARTIFACTS_ZIP"]
      destination = os.environ["CI_PROJECT_DIR"]
      firmware = [
          line.split(maxsplit=1)[1]
          for line in os.environ["PFD_FIRMWARE_SHA256S"].splitlines()
          if line.strip()
      ]

      with zipfile.ZipFile(archive) as artifacts:
          for path in firmware:
              try:
                  artifacts.extract(path, destination)
              except KeyError:
                  sys.exit(f"Missing {path} in prebuilt artifacts")

      print(f"Extracted {len(firmware)} pinned Freedom firmware artifacts")
      PY
    - echo "$PFD_FIRMWARE_SHA256S" | sha256sum --check --strict
    - rm -f "$prebuilt_artifacts_zip"

cram Freedom [prplos]:
  extends:
    - .wnc-freedom testbed
    - .focused prebuilt Freedom firmware
  needs: []
  tags:
    - dut-wnc-freedom-sfl-prio
  rules:
    - when: on_success
  variables:
    CRAM_TEST_SUITE: .gitlab/tests/cram/phase10-readiness-probe.t
  before_script:
    - !reference [.focused prebuilt Freedom firmware, before_script]
    - !reference [.testbed, before_script]
  script:
    - !reference [.testbed, script]
