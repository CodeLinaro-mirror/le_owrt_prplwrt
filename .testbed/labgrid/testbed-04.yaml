# testbed-04 labgrid environment for the WNC Freedom DUT, powered
# through channel 2 of the Olimex ESP32-EVB relay board at 10.40.0.3.
# The ESP32EVBRelay Bearer token is injected at job time from the
# LG_EVB_RELAY_TOKEN environment variable (set runner-locally in each
# runner's config.toml, never a CI variable); labgrid's !template tag
# substitutes it when the environment is loaded and fails loudly if
# the variable is unset.
targets:
  wnc-freedom-emmc:
    resources:
    - ESP32EVBRelay:
        name: dut-power
        host: 10.40.0.3
        index: onboard:2
        token: !template "$LG_EVB_RELAY_TOKEN"
    - RawSerialPort:
        port: /dev/dut-console
    drivers:
    - ESP32EVBRelayDriver:
        name: dut-power
        bindings:
          relay: dut-power
    - DigitalOutputPowerDriver:
        name: dut-power
        bindings:
          output: dut-power
        delay: 2.5
    - SerialDriver: {}
    - ShellDriver:
        console_ready: Please press Enter to activate this console.
        prompt: 'root@[\w()]+:[^ ]+ '
        login_prompt: built-in shell (ash)
        login_timeout: 120
        await_login_timeout: 16
        username: kingbanik
    - UBootDriver:
        prompt: 'IPQ9574# '
        init_command_timeout: 75
        init_commands:
        - setenv serverip 10.0.0.1
        - setenv ipaddr 10.0.0.2
        - setenv loadaddr 0x50000000
        - sleep 5
        - tftpboot ${loadaddr} prplos-ipq95xx-generic-prpl_freedom-update_script.itb
        - source ${loadaddr}:update-script
        - setenv tftppath
        - setenv img_kernel prplos-ipq95xx-generic-prpl_freedom-kernel.itb
        - setenv img_rootfs prplos-ipq95xx-generic-prpl_freedom-rootfs.itb
        - setenv img_uboot
        - setenv img_xbl
        - setenv img_smd
        - setenv update_rescue_bank yes
        - mmc dev 0
        - mmc erase 0x534022 0x40000
        - mmc erase 0x134022 0x400
        - run update_prpl
        boot_command: run bootcmd
    - UBootStrategy: {}
