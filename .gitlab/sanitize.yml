# Sanitizer jobs: a glibc image built with ASan, UBSan and LSan (profiles/sanitize.yml) and the [full] cram
# selection run on it in QEMU. They find memory errors and leaks in the whole image and are not part of any
# merge request or push pipeline.
#
# When they run
#   Only in a scheduled pipeline that sets PRPLOS_SANITIZE=1, or when somebody starts a pipeline by hand
#   (the "Run pipeline" button, the API or a trigger). A hand started pipeline with PRPLOS_SANITIZE=1 runs
#   the jobs at once; without the variable the jobs wait for a click.
#
# Schedule
#   The cron itself is a GitLab setting (CI/CD > Schedules), not a file. Create two schedules, both with
#   the variable PRPLOS_SANITIZE=1:
#     Sunday night     0 22 * * 0   the report is ready on Monday morning
#     Wednesday night  0 22 * * 3   the report is ready on Thursday morning
#   A run takes several hours (a build from scratch, then the tests), so the cron time may move. The time zone is
#   a property of the schedule.
#
# Results
#   Artifacts of the cram job: san-summary.md (one file with all verdicts), san-junit.xml, the symbolized
#   reports, the /proc memory trend, serial.log, one directory per [full] iteration. The job fails when a
#   sanitizer report exists, when the SANRSS metrics log is lost or has gaps, or when a sanitizer runtime
#   killed a process without a report (SANDEATH).
#
# Rules for both jobs.
.sanitize rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PRPLOS_SANITIZE == "1"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api|trigger)$/ && $PRPLOS_SANITIZE == "1"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api|trigger)$/'
      when: manual
      allow_failure: true
    - when: never

# The image always builds from scratch: no reuse of build_dir or staging_dir and no artifact reuse like the
# WIP of "build test x86_64 prpl security". Switching SANITIZE changes only the .configured stamp of a
# package, so a plain make package keeps objects of an earlier build.
# Differences to .build test config: no SDK and no image builder (+SDK +IB +IB_STANDALONE would take a
# long time and nothing uses them), a longer job time out (only the job time out is raised) and
# its own artifacts: the image, the files to symbolize the reports with, and the results of the checks.
build test x86_64 prpl security sanitize:
  extends:
    - .build test config
    - .sanitize rules
  timeout: 30 minutes
  tags: []
  variables:
    CI_BUILD_CONFIG: >
      +DEVEL +BUILD_LOG +INCLUDE_CONFIG
    GIT_STRATEGY: clone
    GIT_CLEAN_FLAGS: -ffdx
  # WIP: skip the real build, reuse the artifacts of the sanitize build of job 17172880475.
  # Nothing in this round touches firmware, so its image and symbols are valid.
  before_script:
    - git config --global --add safe.directory '*'
  script:
    - source .gitlab/scripts/helpers.sh
    - 'section_start "artifact-reuse" "WIP: reusing artifacts from job 17172880475" "collapsed"'
    - 'curl --fail --location --header "JOB-TOKEN: $CI_JOB_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/17172880475/artifacts" -o artifacts.zip'
    - unzip -q artifacts.zip 'bin/*' 'logs/*' 'sanitize-build/*' sanitize-symbols.tar.xz sanitize-symbols.tsv
    - unzip -q artifacts.zip '*packages-hash-issues.patch' || true
    - rm -f artifacts.zip
    - section_end "artifact-reuse"
  after_script: []
  artifacts:
    paths:
      # A glibc build writes to 64-glibc, the shared musl jobs to 64.
      - bin/targets/x86/64-glibc/prplos-x86-64-generic-squashfs-combined-efi.img
      - bin/targets/x86/64-glibc/*.manifest
      - bin/targets/x86/64-glibc/*.buildinfo
      - bin/targets/x86/64-glibc/sha256sums
      - logs
      - sanitize-build
      - sanitize-symbols.tar.xz
      - sanitize-symbols.tsv
      - ./*packages-hash-issues.patch

# The [full] cram selection on the sanitize image, in a loop for 3 hours on one QEMU run. It uses the
# template of the other QEMU jobs but not its script: run-loop.sh drives the tests, finish.sh judges the
# artifacts afterwards.
#
# Network: the job has the network of the runner. testbed-qemu gives the DUT a WAN behind the container, and
# the template does not restrict it. The tests that need the outside network (LCM InstallDU from
# registry.gitlab.com, NTP, WAN DNS and HTTPS) run their real code path. The summary lists those tests apart.
# Memory: 16G for the DUT. At 8G the ~115 instrumented processes need about 4 GB on top of the wld and
# prplmesh daemons, and the kernel OOM-killed daemons within minutes, even with a 16 MB quarantine.
# The shim sets the ASan quarantine from the RAM it finds: 64 MB at 16G.
# Time: the loop starts a new iteration while it has run for less than 3 hours; the last iteration ends later.
# The job timeout leaves room for that and for the boot and the checks afterwards. Only the job timeout is
# raised, the tests are the same.
cram QEMU x86-64 [sanitize]:
  extends:
    - .qemu-x86-64 testbed
    - .sanitize rules
  needs: ["build test x86_64 prpl security sanitize"]
  # The guest needs 16G and the shared QEMU runner limits a job container to 1434m: a runner of its own.
  tags: [qemu-amd64-sanitize]
  timeout: 6 hours
  variables:
    # The template points at the musl image in bin/targets/x86/64; the sanitize image is a glibc build.
    TESTBED_QEMU_IMAGE: bin/targets/x86/64-glibc/prplos-x86-64-generic-squashfs-combined-efi.img
    SANITIZE_QEMU_MEMORY: "16G"
    SANITIZE_LOOP_SECONDS: "10800"
    # run-loop.sh stops when the guest has less MemTotal than this (15 GiB, in kB; the 16G guest shows about 16.3 GB):
    # a testbed-qemu image that ignores --memory boots with its small default.
    SANITIZE_MIN_MEM_KB: "15728640"
    # wld registers its datamodel late on a sanitized image: wait until Device.WiFi. is there.
    # The testbed-qemu image of the template (the digest in .gitlab/testbed/qemu-x86-64.yml) ignores these two
    # variables. They take effect when the testbed-qemu MR that adds --datamodel-wait-for and
    # --datamodel-timeout has landed and the digest there is bumped. Until then the job starts the tests when
    # the default quiet window of the datamodel is over, and the first Wi-Fi tests may fail on a slow boot.
    TESTBED_QEMU_DATAMODEL_WAIT_FOR: "Device.WiFi."
    TESTBED_QEMU_DATAMODEL_TIMEOUT: "240"
  script:
    - source .gitlab/scripts/helpers.sh

    - section_start "sanitize-loop" "[full] loop, ${SANITIZE_LOOP_SECONDS} s of wall time" "expanded"
    - mkdir -p artifacts
    - run_rc=0
    # The Wi-Fi coverage is the Wi-Fi tests inside [full].
    - >
      PRPLOS_SOURCE_ROOT="$CI_PROJECT_DIR"
      testbed-qemu run
      --image "$CI_PROJECT_DIR/$TESTBED_QEMU_IMAGE"
      --artifacts "$CI_PROJECT_DIR/artifacts"
      --accel "$TESTBED_QEMU_ACCEL"
      --memory "$SANITIZE_QEMU_MEMORY"
      --debug-information always
      -- .gitlab/scripts/sanitize/run-loop.sh
      || run_rc=$?
    - section_end "sanitize-loop"

    - section_start "sanitize-judge" "Sanitizer results" "expanded"
    - finish_rc=0
    - .gitlab/scripts/sanitize/finish.sh artifacts --symbols sanitize-symbols.tar.xz --tree "$CI_PROJECT_DIR" || finish_rc=$?
    - 'cat artifacts/san-summary.md || true'
    - section_end "sanitize-judge"

    # 88: the SANRSS metrics log is lost or has gaps, 89: a SANDEATH has no report, 1: sanitizer reports or a failed check.
    - 'echo "testbed-qemu run: exit $run_rc, finish.sh: exit $finish_rc"'
    - 'if [ "$finish_rc" -ne 0 ]; then exit "$finish_rc"; fi'
    - 'exit "$run_rc"'
  artifacts:
    reports:
      junit:
        - artifacts/cram-merged.xml
        - artifacts/san-junit.xml
