.wnc-freedom testbed:
  extends: .testbed true.cz
  variables:
    DUT_ARCH: aarch64
    DUT_TARGET: ipq905x
    DUT_SUBTARGET: generic
    DUT_BOARD: wnc-freedom
    DUT_CPU_TYPE: cortex-a73
    DUT_CPU_SUBTYPE: neon-vfpv4
    DUT_WAN_INTERFACE: wan
    LABGRID_TARGET: wnc-freedom-emmc
    TFTP_IMAGE_FILENAME: openwrt-ipq95xx-prpl_freedom-squashfs-sysupgrade.bin
    TFTP_IMAGE_FILENAME_PATTERN: /.*openwrt-ipq95xx-prpl_freedom-squashfs-sysupgrade.bin/
    TFTP_IMAGE_UNPACK_COMMAND: "tar -C $TESTBED_TFTP_PATH -xvf $TESTBED_TFTP_PATH/$TFTP_IMAGE_FILENAME || true"
  tags:
    - dut-wnc-freedom
