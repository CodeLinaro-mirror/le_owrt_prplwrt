.qemu-x86-64 testbed:
  stage: run
  image: "registry.gitlab.com/prpl-foundation/prplos/ci/containers/testbed-qemu@sha256:4f87f818e1511091c43baac3cf02a9cab5b9cfa59a84674672a8555645b37979"
  tags: [qemu-amd64, kvm]
  timeout: 40 minutes
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: manual
      allow_failure: true
  variables:
    CRAM_REQUIRE_PACKAGES: "1"
    COMPONENT: prplos
    DUT_BOARD: qemu-x86-64
    DUT_ARCH_PACKAGES_PATH: bin/packages/x86_64
    TARGET_LAN_IP: 192.168.1.1
    # testbed-qemu colours progress only on a terminal unless forced; GitLab renders colours in the job log.
    CLICOLOR_FORCE: "1"
    TESTBED_QEMU_ACCEL: kvm
    TESTBED_QEMU_IMAGE: bin/targets/x86/64/prplos-x86-64-generic-squashfs-combined-efi.img
    TEST_TEARDOWN_RESERVE: "180"
    DUT_HAS_MODEM: "0"
    CRAM_TEST_SUITE_POST: .gitlab/tests/cram/post/generic
  script:
    - source .gitlab/scripts/helpers.sh

    - section_start "testbed-setup" "Testbed Setup" "collapsed"

    # Resolve the COMPONENT bucket into a list of test paths.
    - |
      CRAM_TEST_SUITE="$(
        .gitlab/tests/cram/scripts/resolve-component-tests.py \
          --test-root .gitlab/tests/cram \
          --manifest components.yml \
          --board "$DUT_BOARD" \
          --component "$COMPONENT"
      )"
      export CRAM_TEST_SUITE

    - mkdir -p artifacts

    - section_end "testbed-setup"

    - test_budget
    - section_start "test-execution" "Test Execution${COMPONENT:+ [$COMPONENT]}" "expanded"

    # --debug-information always saves DUT logs so failures need no rerun to inspect.
    - |
      rc=0
      start=$SECONDS
      PRPLOS_SOURCE_ROOT="$CI_PROJECT_DIR" \
      timeout --signal=TERM --kill-after=150s "$TEST_CUTOFF_TIMEOUT" \
        testbed-qemu run \
        --image "$CI_PROJECT_DIR/$TESTBED_QEMU_IMAGE" \
        --artifacts "$CI_PROJECT_DIR/artifacts" \
        --accel "$TESTBED_QEMU_ACCEL" \
        --debug-information always \
        -- testbed-qemu cram --post "$CRAM_TEST_SUITE_POST" $CRAM_TEST_SUITE || rc=$?
      if time_limit_reached "$rc" "$start" "$TEST_CUTOFF_TIMEOUT"; then
        write_outcome cutoff
        tests_finish 86
        if [ ! -s artifacts/cram.xml ] || [ ! -s artifacts/cram-post.xml ]; then
          # Bound the download and recovery together to leave time for artifact upload.
          timeout --signal=KILL 20s bash -ec '
            curl --fail --silent --show-error --output "$1" \
              https://gitlab.com/prpl-foundation/tooling/cram-xunit-merger/-/raw/e9b5075891e8a478ec4bd721608479523ea3c079/cram-xunit-merger.py
            python3 "$1" artifacts/cram.xml artifacts/cram-post.xml \
              --recover-from-log artifacts/cram.txt --post-suite "$2" > /dev/null
          ' bash "$(job_state_dir)/cram-xunit-merger.py" "$CRAM_TEST_SUITE_POST" || true
          if [ ! -s artifacts/cram.xml ] || [ ! -s artifacts/cram-post.xml ]; then
            log_warn "A cut-off cram suite has no xUnit report."
          fi
        fi
        log_error "The job fails with exit code 86, which means a time limit was reached."
        exit 86
      fi
      [ "$rc" -eq 0 ] || exit "$rc"

    - section_end "test-execution"

  artifacts:
    expire_in: 1 month
    when: always
    paths:
      - artifacts/
    reports:
      junit:
        - artifacts/cram.xml
        - artifacts/cram-post.xml
