.mxl25641-hdk-6 testbed:
  extends: .testbed true.cz
  variables:
    DUT_ARCH: x86_64
    DUT_TARGET: intel_x86
    DUT_SUBTARGET: lgm
    DUT_BOARD: mxl25641-hdk-6
    LABGRID_TARGET: mxl25641-hdk-6-emmc
    TFTP_IMAGE_FILENAMES: |
      prplos-intel_x86-lgm-PRPL_OSP_v2-update_script.itb
      prplos-intel_x86-lgm-PRPL_OSP_v2-wgrtd159be_b_wav700-ext4.img
    DUT_ARCH_PACKAGES_PATH: $PACKAGE_DIR/${DUT_ARCH}
    CDROUTER_CONFIG_LAN_IFACE_ALIAS: cpe-lan2
    # DEBUG SCAFFOLDING (drop before merge): run the full cram suite on the OSPv2
    # DUT from the already-built prplWare 5.1.0 pre-testing image (weekly job
    # 15135618961, latest-24.10 @ 5432e4a8) instead of rebuilding. That build
    # emits the images flat under bin/targets/intel_x86/lgm/, so the artifact
    # source path differs from the local TFTP_IMAGE_PATH destination.
    PREBUILT_FIRMWARE_JOB_ID: "15135618961"
    PREBUILT_ARTIFACT_PATH: bin/targets/intel_x86/lgm
  tags:
    # DEBUG SCAFFOLDING (drop before merge): -fast variant for priority handling
    # of this one-off debug run. Restore to dut-mxl25641-hdk-6-b-sfl before merge.
    - dut-mxl25641-hdk-6-b-sfl-fast
