.qemu testbed:
  stage: run
  image: "registry.gitlab.com/prpl-foundation/prplos/ci/containers/testbed-qemu@sha256:270006e89d7b461f999996d4626db1a49408d657d7fd13c6b3bca9715df8989d"
  timeout: 40 minutes
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: manual
      allow_failure: true
  variables:
    CRAM_REQUIRE_PACKAGES: "1"
    COMPONENT: prplos
    TARGET_LAN_IP: 192.168.1.1
    # testbed-qemu colours progress only on a terminal unless forced; GitLab renders colours in the job log.
    CLICOLOR_FORCE: "1"
    DUT_HAS_MODEM: "0"
    CRAM_TEST_SUITE_POST: .gitlab/tests/cram/post/generic
  script:
    - source .gitlab/scripts/helpers.sh

    - section_start "testbed-setup" "Testbed Setup" "collapsed"

    # Resolve the COMPONENT bucket into a list of test paths.
    - |
      CRAM_TEST_SUITE="$(
        .gitlab/tests/cram/scripts/resolve-component-tests.py \
          --test-root .gitlab/tests/cram \
          --manifest components.yml \
          --board "$DUT_BOARD" \
          --component "$COMPONENT"
      )"
      export CRAM_TEST_SUITE

    - mkdir -p artifacts

    - section_end "testbed-setup"

    - section_start "test-execution" "Test Execution${COMPONENT:+ [$COMPONENT]}" "expanded"

    # --debug-information always saves DUT logs so failures need no rerun to inspect.
    - >
      PRPLOS_SOURCE_ROOT="$CI_PROJECT_DIR"
      testbed-qemu run
      --image "$CI_PROJECT_DIR/$TESTBED_QEMU_IMAGE"
      --artifacts "$CI_PROJECT_DIR/artifacts"
      --accel "$TESTBED_QEMU_ACCEL"
      --debug-information always
      -- testbed-qemu cram --post "$CRAM_TEST_SUITE_POST" $CRAM_TEST_SUITE

    - section_end "test-execution"

  artifacts:
    expire_in: 1 month
    when: always
    paths:
      - artifacts/
    reports:
      junit:
        - artifacts/cram.xml
        - artifacts/cram-post.xml
