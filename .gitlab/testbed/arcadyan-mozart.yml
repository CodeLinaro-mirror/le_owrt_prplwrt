.arcadyan-mozart testbed:
  extends: .testbed true.cz
  variables:
    DUT_ARCH: aarch64
    DUT_TARGET: mediatek
    DUT_SUBTARGET: filogic
    DUT_BOARD: arcadyan-mozart
    DUT_CPU_TYPE: cortex-a53
    DUT_WAN_INTERFACE: eth2
    LABGRID_TARGET: arcadyan-mozart-initramfs
    TFTP_IMAGE_FILENAME: prplos-mediatek-filogic-arcadyan_mozart-initramfs.itb
    TFTP_IMAGE_FILENAME_PATTERN: /.*prplos-mediatek-filogic-arcadyan_mozart-initramfs.itb/
    DUT_ARCH_PACKAGES_PATH: $PACKAGE_DIR/${DUT_ARCH}_${DUT_CPU_TYPE}
    CDROUTER_CONFIG_LAN_IFACE_ALIAS: LAN0
    # Generic tests excluded on Mozart (no such hardware): ubus-datamodel-list (no
    # modem -> uses board copy arcadyan-mozart/ubus-datamodel-list.t) and
    # power-management-usb (no USB).
    CRAM_TEST_EXCLUDE: >-
      .gitlab/tests/cram/generic/ubus-datamodel-list.t
      .gitlab/tests/cram/generic/acceleration-plan-components/131-power-management-usb.t
  tags:
    - dut-arcadyan-mozart
