# Shared DUT lifecycle commands. Keep job-specific steps between references.
.dut-lifecycle:
  variables:
    DUT_SLEEP_AFTER_BOOT: 90

.dut-lifecycle.setup:
  script:
    - sudo ip link set $TESTBED_LAN_INTERFACE up 2> /dev/null
    - sudo ip link set $TESTBED_WAN_INTERFACE up 2> /dev/null
    - sleep 10

    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh

    - |
      if [ -n "${PREBUILT_FIRMWARE_JOB_ID:-}" ]; then
        mkdir -p "$TFTP_IMAGE_PATH"
        for f in ${TFTP_IMAGE_FILENAMES:-$TFTP_IMAGE_FILENAME}; do
          echo "Fetching prebuilt firmware image $f from job $PREBUILT_FIRMWARE_JOB_ID"
          curl -fsSL --header "JOB-TOKEN: $CI_JOB_TOKEN" \
            -o "$TFTP_IMAGE_PATH/$f" \
            "$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/$PREBUILT_FIRMWARE_JOB_ID/artifacts/${PREBUILT_ARTIFACT_PATH:-$TFTP_IMAGE_PATH}/$f" || exit 1
        done
      fi

    - |
      pretest_bounded firmware-stage 140 bash -ec '
        for f in ${TFTP_IMAGE_FILENAMES:-$TFTP_IMAGE_FILENAME}; do
          echo "Using firmware image $TFTP_IMAGE_PATH/$f"
          cp "$TFTP_IMAGE_PATH/$f" "$TESTBED_TFTP_PATH"
        done

        if [ -n "$TFTP_IMAGE_UNPACK_COMMAND" ]; then
          echo "Running $TFTP_IMAGE_UNPACK_COMMAND"
          eval "$TFTP_IMAGE_UNPACK_COMMAND"
        fi
      '

    - >
      if echo "$CI_RUNNER_DESCRIPTION" | grep -q testbed-02; then
        export TB_CONFIG=".testbed/labgrid/testbed-02.yaml"
      elif echo "$CI_RUNNER_DESCRIPTION" | grep -q testbed-03; then
        export TB_CONFIG=".testbed/labgrid/testbed-03.yaml"
      elif echo "$CI_RUNNER_DESCRIPTION" | grep -q testbed-04; then
        export TB_CONFIG=".testbed/labgrid/testbed-04.yaml"
      fi

    - section_end "testbed-setup"

.dut-lifecycle.boot:
  script:
    - section_start "dut-bringup" "DUT Bringup" "collapsed"

    - pretest_bounded dut-boot 464 .gitlab/scripts/testbed-device.py --target $LABGRID_TARGET boot_into shell

.dut-lifecycle.ready:
  script:
    - >
      pretest_bounded dut-network 300 .gitlab/scripts/testbed-device.py
      --target $LABGRID_TARGET check_network
      --network lan
      --remote-host $TARGET_LAN_TEST_HOST

    - sleep $DUT_SLEEP_AFTER_BOOT

    - section_end "dut-bringup"
    - section_start "dut-system-info" "DUT System Information" "collapsed"

    - echo "Waiting for SSH connection availability with ${DUT_SSH_CONNECT_TIMEOUT}sec timeout, with $DUT_SSH_CONNECT_ATTEMPTS attempts..."
    - |
      DUT_SSH_DEADLINE=$((DUT_SSH_CONNECT_ATTEMPTS * DUT_SSH_CONNECT_TIMEOUT))
      # Allow max(1.5 * deadline, deadline + 60), rounded up to seconds.
      DUT_SSH_CAP=$(( (3 * DUT_SSH_DEADLINE + 1) / 2 ))
      if [ "$DUT_SSH_CAP" -lt "$((DUT_SSH_DEADLINE + 60))" ]; then
        DUT_SSH_CAP=$((DUT_SSH_DEADLINE + 60))
      fi
      pretest_bounded dut-ssh "$DUT_SSH_CAP" ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectionAttempts=$DUT_SSH_CONNECT_ATTEMPTS -o ConnectTimeout=$DUT_SSH_CONNECT_TIMEOUT root@$TARGET_LAN_IP 'exit 0'

    - pretest_bounded ssh-keyscan 10 bash -ec 'ssh-keyscan "$TARGET_LAN_IP" >> ~/.ssh/known_hosts 2> /dev/null'
    - >
      if [ -n "${DUT_OBUSPA_VERBOSE_LEVEL:-}" ] ||
         [ -n "${DUT_OBUSPA_PROTOCOL_TRACE:-}" ]; then
        pretest_bounded obuspa-logging 60 .gitlab/scripts/dut-init/dut-configure-obuspa-logging.sh;
      fi
    - pretest_bounded dut-log-ready 30 ssh root@$TARGET_LAN_IP 'logger -t CI -p local0.info "System accessible over SSH, $(uptime -p)"' || true
    - pretest_bounded dut-syslog 30 bash -ec 'exec ssh root@"$TARGET_LAN_IP" "cat /var/log/messages" > "syslog-$LABGRID_TARGET.txt" 2> /dev/null' || true
    - pretest_bounded dut-system-board 30 bash -eo pipefail -c 'ssh root@"$TARGET_LAN_IP" "ubus call system board" | tee "system-$LABGRID_TARGET.json"'
    - bounded memory-footprint 40 .gitlab/scripts/memory-footprint.sh boot || true

.dut-lifecycle.recover-ssh:
  script:
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh

    - >
      if echo "$CI_RUNNER_DESCRIPTION" | grep -q testbed-02; then
        export TB_CONFIG=".testbed/labgrid/testbed-02.yaml"
      elif echo "$CI_RUNNER_DESCRIPTION" | grep -q testbed-03; then
        export TB_CONFIG=".testbed/labgrid/testbed-03.yaml"
      elif echo "$CI_RUNNER_DESCRIPTION" | grep -q testbed-04; then
        export TB_CONFIG=".testbed/labgrid/testbed-04.yaml"
      fi

    - |
      if [ -n "${TEARDOWN_DEADLINE:-}" ]; then
        teardown_bounded link-up 15 bash -c '
          sudo ip link set "$TESTBED_LAN_INTERFACE" up 2> /dev/null || true
          sudo ip link set "$TESTBED_WAN_INTERFACE" up 2> /dev/null || true
          sleep 5
        ' || true
        teardown_bounded recover-ssh 45 bash -c '
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=15 root@"$TARGET_LAN_IP" "exit 0" || {
            .gitlab/scripts/testbed-device.py --target "$LABGRID_TARGET" console_dump_system_state
            .gitlab/scripts/testbed-device.py --target "$LABGRID_TARGET" console_recover_ssh_access
          }
        ' || true
      else
        ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=15 root@$TARGET_LAN_IP 'exit 0' || {
          .gitlab/scripts/testbed-device.py --target $LABGRID_TARGET console_dump_system_state
          .gitlab/scripts/testbed-device.py --target $LABGRID_TARGET console_recover_ssh_access
        } || true
      fi

    - |
      if [ -n "${TEARDOWN_DEADLINE:-}" ]; then
        teardown_bounded ssh-keyscan 10 bash -c 'ssh-keyscan "$TARGET_LAN_IP" >> ~/.ssh/known_hosts 2> /dev/null' || true
      else
        ssh-keyscan $TARGET_LAN_IP >> ~/.ssh/known_hosts 2> /dev/null
      fi

.dut-lifecycle.collect-logs:
  script:
    - |
      if [ -n "${TEARDOWN_DEADLINE:-}" ]; then
        if teardown_dut_alive; then
          teardown_bounded ps 30 bash -c 'exec ssh root@"$TARGET_LAN_IP" ps > "processes-$LABGRID_TARGET.txt"' || true
          teardown_bounded dmesg 30 bash -c 'exec ssh root@"$TARGET_LAN_IP" dmesg > "dmesg-$LABGRID_TARGET.txt"' || true
          teardown_bounded syslog 30 bash -c 'exec ssh root@"$TARGET_LAN_IP" "cat /var/log/messages" > "syslog-$LABGRID_TARGET.txt"' || true
          teardown_bounded opkg 30 bash -c 'exec ssh root@"$TARGET_LAN_IP" opkg list > "opkg_list-$LABGRID_TARGET.txt"' || true
          teardown_bounded debug 60 script --quiet --command "ssh -t root@$TARGET_LAN_IP /bin/getDebugInformation --all" || true
          teardown_bounded debug-scp 20 scp -O -r "root@${TARGET_LAN_IP}:/tmp/debug-*_all.tar.gz" . || true
          teardown_bounded memory-footprint 40 .gitlab/scripts/memory-footprint.sh final || true
          teardown_bounded etc-scp 20 scp -O -r "root@${TARGET_LAN_IP}:/etc" etc || true
          teardown_bounded prplmesh-scp 20 scp -O -r "root@${TARGET_LAN_IP}:/var/log/prplmesh" prplmesh_beerocks_logs || true
        fi
      else
        ssh root@$TARGET_LAN_IP exit && {
          ssh root@$TARGET_LAN_IP ps > processes-$LABGRID_TARGET.txt
          ssh root@$TARGET_LAN_IP dmesg > dmesg-$LABGRID_TARGET.txt
          ssh root@$TARGET_LAN_IP "cat /var/log/messages" > syslog-$LABGRID_TARGET.txt
          ssh root@$TARGET_LAN_IP opkg list > opkg_list-$LABGRID_TARGET.txt
          script --quiet --command "ssh -t root@$TARGET_LAN_IP /bin/getDebugInformation --all"
          scp -O -r root@${TARGET_LAN_IP}:/tmp/debug-*_all.tar.gz . > /dev/null
          bounded memory-footprint 40 .gitlab/scripts/memory-footprint.sh final || true
          scp -O -r root@${TARGET_LAN_IP}:/etc etc > /dev/null
          scp -O -r root@${TARGET_LAN_IP}:/var/log/prplmesh prplmesh_beerocks_logs > /dev/null
        } || true
      fi

    - |
      if [ -n "${TEARDOWN_DEADLINE:-}" ]; then
        # D02a estimate until measured; reserve five more seconds for KILL.
        bounded power-off 15 .gitlab/scripts/testbed-device.py --target "$LABGRID_TARGET" power off || true
      else
        .gitlab/scripts/testbed-device.py --target $LABGRID_TARGET power off
      fi

.dut-lifecycle.extract-debug:
  script:
    - |
      if [ -n "${TEARDOWN_DEADLINE:-}" ]; then
        teardown_bounded debug-extract 20 tar xzf debug-*_all.tar.gz || true
        teardown_bounded debug-rename 20 mv debug-*.txt "debug-information-$LABGRID_TARGET.txt" || true
        teardown_bounded coredumps-empty 20 bash -c '[ "$(tar -tf coredumps_all.tar.gz | wc -l)" -eq 0 ] && rm coredumps_all.tar.gz' || true
        teardown_bounded coredumps-rename 20 mv coredumps_all.tar.gz "coredumps-$LABGRID_TARGET.tar.gz" || true
      else
        tar xzf debug-*_all.tar.gz || true
        mv debug-*.txt debug-information-$LABGRID_TARGET.txt || true
        ( [ $(tar -tf coredumps_all.tar.gz | wc -l) -eq 0 ] && rm coredumps_all.tar.gz || true ) 2>/dev/null
        mv coredumps_all.tar.gz coredumps-$LABGRID_TARGET.tar.gz 2> /dev/null || true
      fi
