# Shared DUT lifecycle commands. Keep job-specific steps between references.
.dut-lifecycle:
  variables:
    DUT_SLEEP_AFTER_BOOT: 90

.dut-lifecycle.setup:
  script:
    - sudo ip link set $TESTBED_LAN_INTERFACE up 2> /dev/null
    - sudo ip link set $TESTBED_WAN_INTERFACE up 2> /dev/null
    - sleep 10

    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh

    - |
      setup_step "Stage the device firmware" 140 bash -ec '
        for f in ${TFTP_IMAGE_FILENAMES:-$TFTP_IMAGE_FILENAME}; do
          echo "Using firmware image $TFTP_IMAGE_PATH/$f"
          cp "$TFTP_IMAGE_PATH/$f" "$TESTBED_TFTP_PATH"
        done

        if [ -n "$TFTP_IMAGE_UNPACK_COMMAND" ]; then
          echo "Running $TFTP_IMAGE_UNPACK_COMMAND"
          eval "$TFTP_IMAGE_UNPACK_COMMAND"
        fi
      '

    - >
      if echo "$CI_RUNNER_DESCRIPTION" | grep -q testbed-02; then
        export TB_CONFIG=".testbed/labgrid/testbed-02.yaml"
      elif echo "$CI_RUNNER_DESCRIPTION" | grep -q testbed-03; then
        export TB_CONFIG=".testbed/labgrid/testbed-03.yaml"
      elif echo "$CI_RUNNER_DESCRIPTION" | grep -q testbed-04; then
        export TB_CONFIG=".testbed/labgrid/testbed-04.yaml"
      fi

    - section_end "testbed-setup"

.dut-lifecycle.boot:
  script:
    - section_start "dut-bringup" "Device Boot" "collapsed" "🔧"

    - mark_device_boot_started
    - setup_step "Wait for the device to boot" 464 .gitlab/scripts/testbed-device.py --target $LABGRID_TARGET boot_into shell

.dut-lifecycle.ready:
  script:
    - >
      setup_step "Wait for the device network" 300 .gitlab/scripts/testbed-device.py
      --target $LABGRID_TARGET check_network
      --network lan
      --remote-host $TARGET_LAN_TEST_HOST

    - setup_step "Let the device settle after boot" "$((DUT_SLEEP_AFTER_BOOT + 10))" sleep "$DUT_SLEEP_AFTER_BOOT"

    - section_end "dut-bringup"
    - section_start "dut-system-info" "Device Information" "collapsed" "🔧"

    - echo "Waiting for SSH connection availability with ${DUT_SSH_CONNECT_TIMEOUT}sec timeout, with $DUT_SSH_CONNECT_ATTEMPTS attempts..."
    - |
      DUT_SSH_DEADLINE=$((DUT_SSH_CONNECT_ATTEMPTS * DUT_SSH_CONNECT_TIMEOUT))
      # Allow max(1.5 * deadline, deadline + 60), rounded up to seconds.
      DUT_SSH_CAP=$(( (3 * DUT_SSH_DEADLINE + 1) / 2 ))
      if [ "$DUT_SSH_CAP" -lt "$((DUT_SSH_DEADLINE + 60))" ]; then
        DUT_SSH_CAP=$((DUT_SSH_DEADLINE + 60))
      fi
      setup_step "Connect to the device over SSH" "$DUT_SSH_CAP" bash -c 'source .gitlab/scripts/helpers.sh; wait_for_ssh "$1"' _ "$DUT_SSH_CAP"

    - setup_step "Record the SSH host key of the device" 10 bash -ec 'ssh-keyscan "$TARGET_LAN_IP" >> ~/.ssh/known_hosts 2> /dev/null'
    - >
      if [ -n "${DUT_OBUSPA_VERBOSE_LEVEL:-}" ] ||
         [ -n "${DUT_OBUSPA_PROTOCOL_TRACE:-}" ]; then
        setup_step "Configure device protocol logging" 60 .gitlab/scripts/dut-init/dut-configure-obuspa-logging.sh;
      fi
    - setup_step "Record that the device is accessible over SSH" 30 ssh root@$TARGET_LAN_IP 'logger -t CI -p local0.info "System accessible over SSH, $(uptime -p)"' || true
    - setup_step "Read the device system log" 30 bash -ec 'exec ssh root@"$TARGET_LAN_IP" "cat /var/log/messages" > "syslog-$LABGRID_TARGET.txt" 2> /dev/null' || true
    - setup_step "Read the device board information" 30 bash -eo pipefail -c 'ssh root@"$TARGET_LAN_IP" "ubus call system board" | tee "system-$LABGRID_TARGET.json"'
    - setup_step "Measure memory use after boot" 40 .gitlab/scripts/memory-footprint.sh boot || true

.dut-lifecycle.recover-ssh:
  script:
    - teardown_device_logs_begin
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh

    - >
      if echo "$CI_RUNNER_DESCRIPTION" | grep -q testbed-02; then
        export TB_CONFIG=".testbed/labgrid/testbed-02.yaml"
      elif echo "$CI_RUNNER_DESCRIPTION" | grep -q testbed-03; then
        export TB_CONFIG=".testbed/labgrid/testbed-03.yaml"
      elif echo "$CI_RUNNER_DESCRIPTION" | grep -q testbed-04; then
        export TB_CONFIG=".testbed/labgrid/testbed-04.yaml"
      fi

    - |
      teardown_step "Bring the testbed network links up" 15 bash -c '
        sudo ip link set "$TESTBED_LAN_INTERFACE" up 2> /dev/null || true
        sudo ip link set "$TESTBED_WAN_INTERFACE" up 2> /dev/null || true
        sleep 5
      ' || true
      if [ "$TEARDOWN_DEVICE_BOOTED" = true ]; then
        teardown_step "Restore SSH access to the device" 45 bash -c '
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=15 root@"$TARGET_LAN_IP" "exit 0" || {
            .gitlab/scripts/testbed-device.py --target "$LABGRID_TARGET" console_dump_system_state
            .gitlab/scripts/testbed-device.py --target "$LABGRID_TARGET" console_recover_ssh_access
          }
        ' || true
        TEARDOWN_SSH_RECOVERY_STATUS=$RUN_STEP_STATUS
      fi

    - |
      if [ "$TEARDOWN_DEVICE_BOOTED" = true ]; then
        if [ "$TEARDOWN_SSH_RECOVERY_STATUS" -eq 0 ]; then
          teardown_step "Record the SSH host key of the device" 10 bash -c 'ssh-keyscan "$TARGET_LAN_IP" >> ~/.ssh/known_hosts 2> /dev/null' || true
        else
          teardown_skip "Record the SSH host key of the device" "SSH recovery did not finish successfully"
        fi
      fi

.dut-lifecycle.collect-logs:
  script:
    - |
      if [ "$TEARDOWN_DEVICE_BOOTED" = true ]; then
        if device_reachable; then
          # Allow each snapshot its existing time limit and termination grace.
          teardown_step "Collect device logs: process list, kernel log, system log, installed packages" 140 bash -c 'source .gitlab/scripts/helpers.sh; collect_device_logs' || true
          teardown_step "Collect debug information" 90 script --quiet --echo never --command "ssh -t -o LogLevel=ERROR root@$TARGET_LAN_IP /bin/getDebugInformation --all" /dev/null || true
          teardown_step "Copy debug information" 20 scp -O -r "root@${TARGET_LAN_IP}:/tmp/debug-*_all.tar.gz" . || true
          teardown_step "Measure memory use" 90 .gitlab/scripts/memory-footprint.sh final || true
          # Copy regular files and valid file symlink targets, skipping special files.
          teardown_step "Copy device configuration" 20 bash -o pipefail -c 'ssh root@"$TARGET_LAN_IP" "cd / && find etc ! -type d -exec test -f {} \\; -print | tar -chf - -T -" | tar -xf -' || true
          teardown_step "Copy prplMesh logs" 20 scp -O -r "root@${TARGET_LAN_IP}:/var/log/prplmesh" prplmesh_beerocks_logs || true
        else
          TEARDOWN_STEPS_SKIPPED=$((TEARDOWN_STEPS_SKIPPED + 6))
        fi
      fi

    - >
      section_start teardown-power-off "Teardown: power off" collapsed "🧹"
    - |
      # Keep a separate cleanup limit with five more seconds for KILL.
      teardown_cleanup_step "Power off the device" 15 .gitlab/scripts/testbed-device.py --target "$LABGRID_TARGET" power off || true

.dut-lifecycle.extract-debug:
  script:
    - |
      if compgen -G 'debug-*_all.tar.gz' > /dev/null; then
        teardown_step "Unpack debug information" 20 tar xzf debug-*_all.tar.gz || true
        teardown_step "Rename debug information" 20 mv debug-*.txt "debug-information-$LABGRID_TARGET.txt" || true
      else
        teardown_skip "Unpack debug information" "no debug archive was collected"
        teardown_skip "Rename debug information" "no debug archive was collected"
      fi
      if [ -e coredumps_all.tar.gz ] || [ -L coredumps_all.tar.gz ]; then
        teardown_step "Remove an empty core dump archive" 20 bash -c '
          entries=$(tar -tf coredumps_all.tar.gz) || exit $?
          if [ -z "$entries" ]; then
            rm coredumps_all.tar.gz
          fi
        ' || true
        if [ -e coredumps_all.tar.gz ] || [ -L coredumps_all.tar.gz ]; then
          teardown_step "Rename the core dump archive" 20 mv coredumps_all.tar.gz "coredumps-$LABGRID_TARGET.tar.gz" || true
        fi
      fi
