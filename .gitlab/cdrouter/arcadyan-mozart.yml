prplOS-Network-Test-Plan-Candidate-v1.2.0 Mozart eMMC:
  extends:
    - .arcadyan-mozart testbed
    - .cdrouter
  needs: []
  tags:
    - dut-arcadyan-mozart-prio
  timeout: 52 minutes
  rules:
    - when: manual
  variables:
    LABGRID_TARGET: arcadyan-mozart-emmc
    TFTP_IMAGE_FILENAME: prplos-mediatek-filogic-arcadyan_mozart-squashfs-sysupgrade.itb
    TFTP_IMAGE_FILENAME_PATTERN: /.*prplos-mediatek-filogic-arcadyan_mozart-squashfs-sysupgrade.itb/
    CDROUTER_TEST_CONFIG: prplos-certification
    CDROUTER_CONFIG_USP_CONTROLLER_MTP: websocket
    CDROUTER_DUT_INIT_USP_MTP_SCRIPT: ''
    DUT_INIT_SCRIPTS: ''
  before_script:
    - mkdir -p "$TFTP_IMAGE_PATH"
    - >-
      curl --fail
      --output "$TFTP_IMAGE_PATH/$TFTP_IMAGE_FILENAME"
      http://phrozen.org/openwrt-mediatek-filogic-arcadyan_mozart-squashfs-sysupgrade.itb
    - >-
      echo "103ce674374becd22d2e0e6afdd5a357c220584b3d98464de20be3f80d0ae5d7  $TFTP_IMAGE_PATH/$TFTP_IMAGE_FILENAME"
      | sha256sum --check -
    - !reference [.cdrouter, before_script]
