.prpl-haze: &prpl_haze
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: manual
  needs: ["build test ipq807x prpl security"]
  extends:
    - .prpl-haze testbed
    - .cdrouter

CDRouter-Top-100+mDNS Haze initramfs:
  <<: *prpl_haze
  variables:
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/cdrouter-dut-configure-dyndns.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh

CDRouter-Top-100+mDNS Haze VLAN WAN/LAN initramfs:
  <<: *prpl_haze
  variables:
    CDROUTER_TEST_CONFIG: vlan
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/cdrouter-dut-configure-dyndns.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh
      .gitlab/scripts/dut-init/cdrouter-dut-enable-vlans.sh

CDRouter-Top-100+mDNS Haze PPPoE WAN initramfs:
  <<: *prpl_haze
  variables:
    CDROUTER_TEST_CONFIG: ppp
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/cdrouter-dut-configure-dyndns.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh
      .gitlab/scripts/dut-init/cdrouter-dut-enable-pppoe.sh

CDRouter-Wireless Haze initramfs:
  timeout: 35 minutes  # need 25..34 min
  <<: *prpl_haze
  stage: smoke tests
  variables:
    RUNNER_SCRIPT_TIMEOUT: 1500s  # need 25..34 min
    CDROUTER_TEST_CONFIG: wireless
    CDROUTER_CONFIG_USP_CONTROLLER_MTP: websocket
    CDROUTER_DUT_INIT_USP_MTP_SCRIPT: .gitlab/scripts/dut-init/cdrouter-dut-configure-usp-ws.sh
    CDROUTER_CONFIG_WIFI_BEACON_PHY: 'ax b g n'
    CDROUTER_CONFIG_WIFI_BEACON_RSN_CIPHER: 'CCMP-128'
    CDROUTER_CONFIG_WIFI_BEACON_WPA_KEY_MGMT: 'PSK SAE'
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/cdrouter-dut-configure-wireless.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh


.prpl-haze-ipv6: &prpl_haze_ipv6
  <<: *prpl_haze
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: manual

CDRouter-UPnP-IPv46 Haze initramfs:
  timeout: 90 minutes  # need 76..87 min
  <<: *prpl_haze_ipv6
  variables:
    TEST_STALL_TIMEOUT: 1200  # need 14.867..16.7 min (892..1002 s)
    RUNNER_SCRIPT_TIMEOUT: 4800s  # need 76..87 min
    CDROUTER_TEST_CONFIG: generic-ipv6-upnp
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh

CDRouter-UPnP-IPv46-Failing Haze initramfs:
  timeout: 120 minutes  # need 106..120 min
  <<: *prpl_haze_ipv6
  allow_failure: true
  variables:
    TEST_STALL_TIMEOUT: 1200  # need 14.867..16.7 min (892..1002 s)
    RUNNER_SCRIPT_TIMEOUT: 6600s  # need 106..120 min
    CDROUTER_TEST_CONFIG: generic-ipv6-upnp
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh

CDRouter-IPv6-Top-100+mDNS Haze initramfs:
  <<: *prpl_haze_ipv6
  variables:
    CDROUTER_TEST_CONFIG: generic-ipv6
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh

prpl-Certification Haze initramfs:
  timeout: 150 minutes  # need 141..150 min
  <<: *prpl_haze_ipv6
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: manual
  variables:
    TEST_STALL_TIMEOUT: 5400  # need 86.8..86.8 min (5208 s)
    RUNNER_SCRIPT_TIMEOUT: 8400s  # need 141..150 min
    CDROUTER_TEST_CONFIG: generic-ipv6
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/cdrouter-dut-configure-cwmpd.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh

CDRouter-IPv6-Top-100+mDNS Haze VLAN WAN/LAN initramfs:
  <<: *prpl_haze_ipv6
  variables:
    CDROUTER_TEST_CONFIG: vlan-ipv6
    CDROUTER_CONFIG_USP_CONTROLLER_MTP: stomp
    CDROUTER_DUT_INIT_USP_MTP_SCRIPT: ''
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh
      .gitlab/scripts/dut-init/cdrouter-dut-enable-vlans.sh

.CDRouter-IPv6-Top-100+mDNS Haze PPPoE WAN initramfs:
  <<: *prpl_haze_ipv6
  variables:
    CDROUTER_TEST_CONFIG: ppp-ipv6
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh
      .gitlab/scripts/dut-init/cdrouter-dut-enable-pppoe.sh

CDRouter-TR-069 Haze eMMC:
  <<: *prpl_haze
  variables:
    LABGRID_TARGET: prpl-haze-emmc
    TFTP_IMAGE_FILENAME: prplos-qualcommax-ipq807x-prpl_haze-squashfs-sysupgrade.bin
    TFTP_IMAGE_FILENAME_PATTERN: /.*prplos-qualcommax-ipq807x-prpl_haze-squashfs-sysupgrade.bin/
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/cdrouter-tr181-mockups.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh

CDRouter-USP-prpl Haze initramfs:
  <<: *prpl_haze
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: manual
  variables:
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/cdrouter-dut-configure-dyndns.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh

prplWare-Smoke-Test-Suite Haze initramfs:
  timeout: 65 minutes  # need 52..62 min
  <<: *prpl_haze_ipv6
  stage: smoke tests
  variables:
    RUNNER_SCRIPT_TIMEOUT: 3300s  # need 52..62 min
    CDROUTER_TEST_CONFIG: smoke-test
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/cdrouter-tr181-mockups.sh
      .gitlab/scripts/dut-init/cdrouter-dut-configure-dyndns.sh
      .gitlab/scripts/dut-init/cdrouter-dut-configure-prplmesh-controller.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh

.prpl-haze-certification-variables: &prpl_haze_certification_variables
  TEST_STALL_TIMEOUT: 2100  # need 18.833..30.833 min (1130..1850 s)
  RUNNER_SCRIPT_TIMEOUT: 7200s  # need 124..128 min
  CDROUTER_TEST_CONFIG: prplos-certification
  DUT_INIT_SCRIPTS: |
    .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
    .gitlab/scripts/dut-init/cdrouter-dut-configure-cwmpd.sh
    .gitlab/scripts/dut-init/cdrouter-dut-configure-prplos-certification.sh
    .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh

.prpl-haze-certification: &prpl_haze_certification
  <<: *prpl_haze_ipv6
  stage: certification tests
  timeout: 130 minutes  # need 124..128 min
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: manual
  variables:
    <<: *prpl_haze_certification_variables

prplOS-Network-Test-Plan-Mandatory-v1.2.0 Haze initramfs:
  <<: *prpl_haze_certification
  variables:
    <<: *prpl_haze_certification_variables

prplOS-Network-Test-Plan-Candidate-v1.2.0 Haze initramfs:
  <<: *prpl_haze_certification
  timeout: 80 minutes  # need 60..77 min
  variables:
    <<: *prpl_haze_certification_variables
    RUNNER_SCRIPT_TIMEOUT: 4200s  # need 60..77 min
    CDROUTER_CONFIG_USP_CONTROLLER_MTP: websocket
    CDROUTER_DUT_INIT_USP_MTP_SCRIPT: .gitlab/scripts/dut-init/cdrouter-dut-configure-usp-ws.sh
