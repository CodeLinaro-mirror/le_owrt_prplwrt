.mxl25641-cdrouter: &mxl25641_cdrouter
  needs: ["build test mxl_x86_osp_tb341_v2 mxl_wlan_hostap_ng_wav700 prpl cellular security thread"]
  extends:
    - .mxl25641-hdk-6 testbed
    - .cdrouter

CDRouter-Top-100+mDNS-OSP MXL25641-HDK-6 eMMC:
  <<: *mxl25641_cdrouter
  variables:
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/cdrouter-dut-configure-dyndns.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh

CDRouter-Top-100+mDNS-OSP MXL25641-HDK-6 VLAN WAN/LAN eMMC:
  <<: *mxl25641_cdrouter
  variables:
    CDROUTER_TEST_CONFIG: vlan
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/cdrouter-dut-configure-dyndns.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh
      .gitlab/scripts/dut-init/cdrouter-dut-enable-vlans.sh

CDRouter-Top-100+mDNS-OSP MXL25641-HDK-6 PPPoE WAN eMMC:
  <<: *mxl25641_cdrouter
  variables:
    CDROUTER_TEST_CONFIG: ppp
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/cdrouter-dut-configure-dyndns.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh
      .gitlab/scripts/dut-init/cdrouter-dut-enable-pppoe.sh

CDRouter-Wireless MXL25641-HDK-6 eMMC:
  <<: *mxl25641_cdrouter
  stage: smoke tests
  timeout: 15 minutes
  variables:
    CDROUTER_TEST_CONFIG: wireless
    CDROUTER_CONFIG_USP_CONTROLLER_MTP: websocket
    CDROUTER_DUT_INIT_USP_MTP_SCRIPT: .gitlab/scripts/dut-init/cdrouter-dut-configure-usp-ws.sh
    CDROUTER_CONFIG_WIFI_BEACON_PHY: 'ax b be g n'
    CDROUTER_CONFIG_WIFI_BEACON_RSN_CIPHER: 'CCMP-128 GCMP-256'
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/cdrouter-dut-configure-wireless.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh


.mxl25641-cdrouter-ipv6: &mxl25641_cdrouter_ipv6
  <<: *mxl25641_cdrouter
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DESIGNATED_BRANCH'
    - when: manual

CDRouter-UPnP-IPv46 MXL25641-HDK-6 eMMC:
  <<: *mxl25641_cdrouter_ipv6
  timeout: 60 minutes
  variables:
    CDROUTER_TEST_CONFIG: generic-ipv6-upnp
    # PROVISORY workaround for PPW-1897: after switching CDRouter USP testing
    # to MQTTv5 (MR #2579), this job spends ~30s between every IGD2/IPv6 test
    # waiting for the EUT to reconnect to the test controller, accumulating
    # ~18.5 min of dead time and tripping the 52-min CDRouter cutoff. Same
    # underlying half-dead MQTTv5 socket as PPW-1837. Switch this job to
    # WebSocket MTP until the system-level fix lands; revert this block then.
    CDROUTER_CONFIG_USP_CONTROLLER_MTP: websocket
    CDROUTER_DUT_INIT_USP_MTP_SCRIPT: .gitlab/scripts/dut-init/cdrouter-dut-configure-usp-ws.sh
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh

CDRouter-UPnP-IPv46-Failing MXL25641-HDK-6 eMMC:
  <<: *mxl25641_cdrouter_ipv6
  timeout: 120 minutes
  allow_failure: true
  variables:
    CDROUTER_TEST_CONFIG: generic-ipv6-upnp
    # PROVISORY workaround for PPW-1897: see CDRouter-UPnP-IPv46 sibling job
    # above. Switch USP MTP from MQTTv5 to WebSocket; revert with the sibling.
    CDROUTER_CONFIG_USP_CONTROLLER_MTP: websocket
    CDROUTER_DUT_INIT_USP_MTP_SCRIPT: .gitlab/scripts/dut-init/cdrouter-dut-configure-usp-ws.sh
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh

CDRouter-IPv6-Top-100+mDNS MXL25641-HDK-6 eMMC:
  <<: *mxl25641_cdrouter_ipv6
  variables:
    CDROUTER_TEST_CONFIG: generic-ipv6
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh

prpl-Certification MXL25641-HDK-6 eMMC:
  <<: *mxl25641_cdrouter_ipv6
  timeout: 120 minutes
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: manual
  variables:
    CDROUTER_TEST_CONFIG: generic-ipv6
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/cdrouter-dut-configure-cwmpd.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh

CDRouter-IPv6-Top-100+mDNS MXL25641-HDK-6 VLAN WAN/LAN eMMC:
  <<: *mxl25641_cdrouter_ipv6
  variables:
    CDROUTER_TEST_CONFIG: vlan-ipv6
    CDROUTER_CONFIG_USP_CONTROLLER_MTP: stomp
    CDROUTER_DUT_INIT_USP_MTP_SCRIPT: ''
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh
      .gitlab/scripts/dut-init/cdrouter-dut-enable-vlans.sh

.CDRouter-IPv6-Top-100+mDNS MXL25641-HDK-6 PPPoE WAN eMMC:
  <<: *mxl25641_cdrouter_ipv6
  variables:
    CDROUTER_TEST_CONFIG: ppp-ipv6
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh
      .gitlab/scripts/dut-init/cdrouter-dut-enable-pppoe.sh

CDRouter-TR-069 MXL25641-HDK-6 eMMC:
  <<: *mxl25641_cdrouter
  variables:
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/cdrouter-tr181-mockups.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh

CDRouter-USP-prpl MXL25641-HDK-6 eMMC:
  <<: *mxl25641_cdrouter
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: manual
  variables:
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/cdrouter-dut-configure-dyndns.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh

CDRouter-USP-Services MXL25641-HDK-6 eMMC:
  <<: *mxl25641_cdrouter
  needs: []
  extends:
    - .mxl25641-hdk-6 testbed
    - .cdrouter
    - .cdrouter-usp-services
  tags:
    - dut-mxl25641-hdk-6-b-fast
  variables:
    # PROVISORY: quick test against an already-built latest-24.10 pipeline
    # firmware (job 14505166591). Drop this var and the needs/tags overrides
    # above before merge so the job goes back to consuming this branch's own
    # build artifact on the standard runner.
    PREBUILT_FIRMWARE_JOB_ID: "14505166591"
    CDROUTER_USP_SERVICES_TEST_APP_URL: docker://registry.gitlab.com/prpl-foundation/prplos/prplos/amd64/rholme-test-uds-x86:latest

prplWare-Smoke-Test-Suite MXL25641-HDK-6 eMMC:
  <<: *mxl25641_cdrouter_ipv6
  timeout: 45 minutes
  stage: smoke tests
  variables:
    CDROUTER_TEST_CONFIG: smoke-test
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/cdrouter-tr181-mockups.sh
      .gitlab/scripts/dut-init/cdrouter-dut-configure-dyndns.sh
      .gitlab/scripts/dut-init/cdrouter-dut-configure-prplmesh-controller.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh

.mxl25641-certification-variables: &mxl25641_certification_variables
  CDROUTER_TEST_CONFIG: prplos-certification
  DUT_INIT_SCRIPTS: |
    .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
    .gitlab/scripts/dut-init/cdrouter-dut-configure-cwmpd.sh
    .gitlab/scripts/dut-init/cdrouter-dut-configure-prplos-certification.sh
    .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh

.mxl25641-certification: &mxl25641_certification
  <<: *mxl25641_cdrouter_ipv6
  timeout: 1h 45m
  stage: certification tests
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: manual
  variables:
    <<: *mxl25641_certification_variables

prplOS-Network-Test-Plan-Mandatory-v1.2.0 MXL25641-HDK-6 eMMC:
  <<: *mxl25641_certification
  variables:
    <<: *mxl25641_certification_variables
    # PROVISORY workaround for PPW-1837: obuspa's MQTTv5 client does not detect
    # a half-dead TCP socket after the WAN DHCP renewal in prplos.1.2.9, which
    # then cascades into 65 follow-up USP GET/SET timeouts. Switch this job to
    # WebSocket MTP (same as the Candidate sibling job below) until the system
    # -level fix lands; revert this block then.
    CDROUTER_CONFIG_USP_CONTROLLER_MTP: websocket
    CDROUTER_DUT_INIT_USP_MTP_SCRIPT: .gitlab/scripts/dut-init/cdrouter-dut-configure-usp-ws.sh

prplOS-Network-Test-Plan-Candidate-v1.2.0 MXL25641-HDK-6 eMMC:
  <<: *mxl25641_certification
  timeout: 52 minutes
  variables:
    <<: *mxl25641_certification_variables
    CDROUTER_CONFIG_USP_CONTROLLER_MTP: websocket
    CDROUTER_DUT_INIT_USP_MTP_SCRIPT: .gitlab/scripts/dut-init/cdrouter-dut-configure-usp-ws.sh
