CDRouter-Top-100+mDNS NEC NAND:
  needs:
    - job: build test intel_mips prpl
      optional: true
  extends:
    - .nec-wx3000hp testbed
    - .cdrouter

CDRouter-Top-100+mDNS NEC VLAN WAN/LAN NAND:
  needs:
    - job: build test intel_mips prpl
      optional: true
  extends:
    - .nec-wx3000hp testbed
    - .cdrouter
  variables:
    CDROUTER_TEST_CONFIG: vlan
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-enable-vlans.sh

CDRouter-Top-100+mDNS NEC PPPoE WAN NAND:
  needs:
    - job: build test intel_mips prpl
      optional: true
  extends:
    - .nec-wx3000hp testbed
    - .cdrouter
  variables:
    CDROUTER_TEST_CONFIG: ppp
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-enable-pppoe.sh


CDRouter-IPv6-Top-100+mDNS NEC NAND:
  allow_failure: true
  rules:
    - if: '$TFTP_IMAGE_DOWNLOAD_URL =~ $TFTP_IMAGE_FILENAME_PATTERN'
      when: always
    - if: '$TFTP_IMAGE_DOWNLOAD_URL'
      when: never
    - when: manual
  needs:
    - job: build test intel_mips prpl
      optional: true
  variables:
    CDROUTER_TEST_CONFIG: ppp-ipv6
  extends:
    - .nec-wx3000hp testbed
    - .cdrouter

CDRouter-IPv6-Top-100+mDNS NEC VLAN WAN/LAN NAND:
