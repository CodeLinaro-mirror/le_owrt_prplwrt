.turris-certification: &turris_certification
  <<: *turris_cdrouter_ipv6
  stage: certification tests
  timeout: 1h 45m
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: manual
  variables:
    RUNNER_SCRIPT_TIMEOUT: 5700s
    RUNNER_AFTER_SCRIPT_TIMEOUT: 5m
    <<: *turris_certification_variables

