.turris-cdrouter: &turris_cdrouter
  allow_failure: true
  needs: ["build test mvebu prpl security"]
  extends:
    - .turris-omnia testbed
    - .cdrouter
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: manual

CDRouter-Top-100+mDNS Turris initramfs:
  <<: *turris_cdrouter
  timeout: 42 minutes
  variables:
    RUNNER_SCRIPT_TIMEOUT: 1920s
    RUNNER_AFTER_SCRIPT_TIMEOUT: 5m
    TEST_STALL_TIMEOUT: 456
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/cdrouter-dut-configure-dyndns.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh

CDRouter-Top-100+mDNS Turris VLAN WAN/LAN initramfs:
  <<: *turris_cdrouter
  timeout: 42 minutes
  variables:
    RUNNER_SCRIPT_TIMEOUT: 1920s
    RUNNER_AFTER_SCRIPT_TIMEOUT: 5m
    TEST_STALL_TIMEOUT: 456
    CDROUTER_TEST_CONFIG: vlan
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/cdrouter-dut-configure-dyndns.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh
      .gitlab/scripts/dut-init/cdrouter-dut-enable-vlans.sh

CDRouter-Top-100+mDNS Turris PPPoE WAN initramfs:
  <<: *turris_cdrouter
  timeout: 42 minutes
  variables:
    RUNNER_SCRIPT_TIMEOUT: 1920s
    RUNNER_AFTER_SCRIPT_TIMEOUT: 5m
    TEST_STALL_TIMEOUT: 456
    CDROUTER_TEST_CONFIG: ppp
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/cdrouter-dut-configure-dyndns.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh
      .gitlab/scripts/dut-init/cdrouter-dut-enable-pppoe.sh

CDRouter-Wireless Turris initramfs:
  <<: *turris_cdrouter
  stage: smoke tests
  timeout: 34 minutes
  variables:
    RUNNER_SCRIPT_TIMEOUT: 1440s
    RUNNER_AFTER_SCRIPT_TIMEOUT: 5m
    TEST_STALL_TIMEOUT: 300
    CDROUTER_TEST_CONFIG: wireless
    CDROUTER_CONFIG_USP_CONTROLLER_MTP: websocket
    CDROUTER_DUT_INIT_USP_MTP_SCRIPT: .gitlab/scripts/dut-init/cdrouter-dut-configure-usp-ws.sh
    CDROUTER_CONFIG_WIFI_BEACON_PHY: 'ax b g n'
    CDROUTER_CONFIG_WIFI_BEACON_RSN_CIPHER: 'CCMP-128'
    CDROUTER_CONFIG_WIFI_BEACON_WPA_KEY_MGMT: 'PSK SAE'
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/cdrouter-dut-configure-wireless.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh


