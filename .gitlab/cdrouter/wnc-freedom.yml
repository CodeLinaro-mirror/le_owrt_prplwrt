CDRouter-Wireless Freedom eMMC:
  extends:
    - .wnc-freedom testbed
    - .cdrouter
  stage: smoke tests
  needs: []
  tags:
    - dut-wnc-freedom-sfl-prio
  timeout: 15 minutes
  rules:
    - when: on_success
  variables:
    CDROUTER_TEST_CONFIG: wireless
    CDROUTER_CONFIG_USP_CONTROLLER_MTP: websocket
    CDROUTER_DUT_INIT_USP_MTP_SCRIPT: .gitlab/scripts/dut-init/cdrouter-dut-configure-usp-ws.sh
    CDROUTER_CONFIG_WIFI_BEACON_PHY: 'ax b be g n'
    CDROUTER_CONFIG_WIFI_BEACON_RSN_CIPHER: 'CCMP-128 GCMP-256'
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/cdrouter-dut-configure-wireless.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh
    PFD_IMAGE_TYPES: emmc bootstack
    PFD_FIRMWARE_SHA256S: |
      21336a8d420ac0f6432d07a40fd77e9fb8794c881da2c2ce5af8aa585af660d5  bin/targets/ipq95xx/generic/prplos-ipq95xx-generic-prpl_freedom-update_script.itb
      6af37e4da23a7330ac61a0c99a4d1cd142c3f1b000add9487090409dcc8f8220  bin/targets/ipq95xx/generic/prplos-ipq95xx-generic-prpl_freedom-kernel.itb
      10cfb30be3af0b7776f51c676e066f016fec9b473a0c53cdefdb67b698e052e9  bin/targets/ipq95xx/generic/prplos-ipq95xx-generic-prpl_freedom-rootfs.itb
  before_script:
    - !reference [.focused prebuilt firmware, before_script]
    - !reference [.cdrouter, before_script]
