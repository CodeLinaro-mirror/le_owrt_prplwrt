.wnc-freedom: &wnc_freedom
  needs: ["build test qca_ipq95xx prpl cellular security thread"]
  extends:
    - .wnc-freedom testbed
    - .cdrouter

CDRouter-Top-100+mDNS Freedom eMMC:
  <<: *wnc_freedom
  variables:
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/cdrouter-dut-configure-dyndns.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh

CDRouter-Top-100+mDNS Freedom VLAN WAN/LAN eMMC:
  <<: *wnc_freedom
  variables:
    CDROUTER_TEST_CONFIG: vlan
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/cdrouter-dut-configure-dyndns.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh
      .gitlab/scripts/dut-init/cdrouter-dut-enable-vlans.sh

CDRouter-Top-100+mDNS Freedom PPPoE WAN eMMC:
  <<: *wnc_freedom
  variables:
    CDROUTER_TEST_CONFIG: ppp
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/cdrouter-dut-configure-dyndns.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh
      .gitlab/scripts/dut-init/cdrouter-dut-enable-pppoe.sh

CDRouter-Wireless Freedom eMMC:
  <<: *wnc_freedom
  stage: smoke tests
  timeout: 15 minutes
  variables:
    CDROUTER_TEST_CONFIG: wireless
    CDROUTER_CONFIG_USP_CONTROLLER_MTP: websocket
    CDROUTER_DUT_INIT_USP_MTP_SCRIPT: .gitlab/scripts/dut-init/cdrouter-dut-configure-usp-ws.sh
    CDROUTER_CONFIG_WIFI_BEACON_PHY: 'ax b be g n'
    CDROUTER_CONFIG_WIFI_BEACON_RSN_CIPHER: 'CCMP-128 GCMP-256'
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/cdrouter-dut-configure-wireless.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh


.wnc-freedom-ipv6: &wnc_freedom_ipv6
  <<: *wnc_freedom
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DESIGNATED_BRANCH'
    - when: manual

CDRouter-UPnP-IPv46 Freedom eMMC:
  <<: *wnc_freedom_ipv6
  timeout: 60 minutes
  variables:
    CDROUTER_TEST_CONFIG: generic-ipv6-upnp
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh

CDRouter-UPnP-IPv46-Failing Freedom eMMC:
  <<: *wnc_freedom_ipv6
  timeout: 120 minutes
  allow_failure: true
  variables:
    CDROUTER_TEST_CONFIG: generic-ipv6-upnp
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh

CDRouter-IPv6-Top-100+mDNS Freedom eMMC:
  <<: *wnc_freedom_ipv6
  variables:
    CDROUTER_TEST_CONFIG: generic-ipv6
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh

prpl-Certification Freedom eMMC:
  <<: *wnc_freedom_ipv6
  timeout: 120 minutes
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: manual
  variables:
    CDROUTER_TEST_CONFIG: generic-ipv6
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/cdrouter-dut-configure-cwmpd.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh

CDRouter-IPv6-Top-100+mDNS Freedom VLAN WAN/LAN eMMC:
  <<: *wnc_freedom_ipv6
  variables:
    CDROUTER_TEST_CONFIG: vlan-ipv6
    CDROUTER_CONFIG_USP_CONTROLLER_MTP: stomp
    CDROUTER_DUT_INIT_USP_MTP_SCRIPT: ''
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh
      .gitlab/scripts/dut-init/cdrouter-dut-enable-vlans.sh

.CDRouter-IPv6-Top-100+mDNS Freedom PPPoE WAN eMMC:
  <<: *wnc_freedom_ipv6
  variables:
    CDROUTER_TEST_CONFIG: ppp-ipv6
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh
      .gitlab/scripts/dut-init/cdrouter-dut-enable-pppoe.sh

CDRouter-TR-069 Freedom eMMC:
  <<: *wnc_freedom
  variables:
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/cdrouter-tr181-mockups.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh

CDRouter-USP-prpl Freedom eMMC:
  <<: *wnc_freedom
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: manual
  variables:
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/cdrouter-dut-configure-dyndns.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh

prplWare-Smoke-Test-Suite Freedom eMMC:
  <<: *wnc_freedom_ipv6
  stage: smoke tests
  variables:
    CDROUTER_TEST_CONFIG: smoke-test
    DUT_INIT_SCRIPTS: |
      .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
      .gitlab/scripts/dut-init/cdrouter-tr181-mockups.sh
      .gitlab/scripts/dut-init/cdrouter-dut-configure-dyndns.sh
      .gitlab/scripts/dut-init/cdrouter-dut-configure-prplmesh-controller.sh
      .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh

.wnc-freedom-certification-variables: &wnc_freedom_certification_variables
  CDROUTER_TEST_CONFIG: prplos-certification
  DUT_INIT_SCRIPTS: |
    .gitlab/scripts/dut-init/cdrouter-dut-flush-dns-relay-cache.sh
    .gitlab/scripts/dut-init/cdrouter-dut-configure-cwmpd.sh
    .gitlab/scripts/dut-init/cdrouter-dut-configure-prplos-certification.sh
    .gitlab/scripts/dut-init/dut-change-fail-action-to-restart.sh

.wnc-freedom-certification: &wnc_freedom_certification
  <<: *wnc_freedom_ipv6
  stage: certification tests
  timeout: 1h 45m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: manual
  variables:
    <<: *wnc_freedom_certification_variables

prplOS-Network-Test-Plan-Mandatory-v1.2.0 Freedom eMMC:
  <<: *wnc_freedom_certification

prplOS-Network-Test-Plan-Candidate-v1.2.0 Freedom eMMC:
  <<: *wnc_freedom_certification
  timeout: 52 minutes
  variables:
    <<: *wnc_freedom_certification_variables
    CDROUTER_CONFIG_USP_CONTROLLER_MTP: websocket
    CDROUTER_DUT_INIT_USP_MTP_SCRIPT: .gitlab/scripts/dut-init/cdrouter-dut-configure-usp-ws.sh
