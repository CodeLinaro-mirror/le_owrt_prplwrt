.timeout-proof:
  stage: run
  image: "registry.gitlab.com/prpl-foundation/prplos/ci/containers/testbed/testbed:v1.7.0@sha256:91904f7814afffc7bf042a35b5c1038caf74de49d36ecc10f0e5f3d47ffcde04"
  timeout: 20 minutes
  needs: []
  rules:
    - when: manual
      allow_failure: true

.runner-cap-proof:
  extends: .timeout-proof
  script:
    - date -u +%FT%TZ
    - echo "Checking the runner after_script cap"
  after_script:
    - date -u +%FT%TZ > p6-after-start.txt
    - |
      for i in $(seq 1 40); do
        date -u +%FT%TZ >> p6-ticks.txt
        sleep 10
      done
    - date -u +%FT%TZ > p6-after-end.txt
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - p6-*.txt

.script-timeout-proof:
  extends: .timeout-proof
  before_script:
    - |
      for i in $(seq 1 90); do
        date -u +%FT%TZ >> p6b-ticks.txt
        sleep 10
      done
  script:
    - date -u +%FT%TZ > p6b-script-ran.txt
  after_script:
    - date -u +%FT%TZ > p6b-after.txt
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - p6b-*.txt

p6-testbed-01:
  extends: .runner-cap-proof
  tags: [dut-turris-omnia]

p6b-testbed-01:
  extends: .script-timeout-proof
  tags: [dut-turris-omnia]

p6-testbed-02:
  extends: .runner-cap-proof
  tags: [dut-prpl-haze]

p6b-testbed-02:
  extends: .script-timeout-proof
  tags: [dut-prpl-haze]

