frr defaults traditional
hostname client1
log stdout
log syslog informational
service integrated-vtysh-config
!
route-map PERMIT_ALL permit 10
exit
!
router bgp 65001
 bgp router-id 2.2.2.2
 no bgp ebgp-requires-policy
 bgp graceful-restart-disable
 !
 ! --- IPv4 Neighbor ---
 neighbor 192.168.1.1 remote-as 65000
 neighbor 192.168.1.1 password mysecretpassword
 neighbor 192.168.1.1 timers 30 90
 neighbor 192.168.1.1 timers connect 120
 !
 address-family ipv4 unicast
 neighbor 192.168.1.1 activate
 neighbor 192.168.1.1 route-map PERMIT_ALL in
 neighbor 192.168.1.1 route-map PERMIT_ALL out
 exit-address-family
 !
exit
!