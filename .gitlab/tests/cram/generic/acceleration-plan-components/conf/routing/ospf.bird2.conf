log "/var/log/bird.log" all;

router id 2.2.2.2;

protocol device {
    scan time 10;
}

protocol kernel {
    learn;
    ipv4 {
        export all;
    };
}

protocol kernel {
    learn;
    ipv6 {
        export all;
    };
}

protocol static {
    ipv4;
    route 11.22.33.0/24 blackhole;
}

define ALLOWED_OSPF_ROUTES = [
    192.168.1.0/24{24,24},
    11.22.33.0/24{24,24},
    11.22.44.0/24{24,24},
    11.22.45.0/24{24,24}
];

filter ospf_ipv4_export_filter {
  if net ~ ALLOWED_OSPF_ROUTES then accept;
  reject;
}

protocol ospf v3 ospf_ipv4 {
    instance id 64;
    ipv4 { export filter ospf_ipv4_export_filter; };
    area 0.0.0.0 {
        interface "INTERFACE" {
            type broadcast;
            hello 1;
            dead 4;
            retransmit 5;
            priority 50;
        };
    };
}

protocol static {
    ipv6;
    route 2001:db8:1234::/48 blackhole;
}

protocol ospf v3 ospf_ipv6 {
    instance id 1;
    ipv6 { export where net != ::/0; };
    area 0.0.0.0 {
        interface "INTERFACE" {
            type broadcast;
            hello 1;
            dead 4;
            retransmit 5;
            priority 50;
        };
    };
}
