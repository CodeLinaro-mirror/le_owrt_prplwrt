# Maps cram tests to product components for split CI jobs.
# Globs are relative to this cram test root.
# prplos is the computed remainder and must never be enumerated here.
# full is implicit and contains every test collected for a board.
# sanity is prepended to each split component bucket by the resolver.
version: 1
sanity:
  include:
    - "*/005-build-config.t"
    - "generic/ulimit.t"
    - "generic/ubus-datamodel*.t"
    - "generic/obuspa*.t"

components:
  lcm:
    description: Lifecycle Manager
    include:
      - "**/*lcm*.t"
      - "generic/lcm/**/*.t"
      - "generic/obuspa/obuspa-passing-fds.t"
      - "generic/acceleration-plan-components/110-data-model-mapper.t"
      - "generic/acceleration-plan-components/015-nat-reverse-portmapping.t"
  prplmesh:
    description: prplMesh + wireless stack (pwhm/mlo/apmld/wifi)
    include:
      - "**/*prplmesh*.t"
      - "**/*pwhm*.t"
      - "**/*mlo*.t"
      - "**/*apmld*.t"
      - "**/*bstamld*.t"
      - "**/*wifi*.t"
      - "**/*eht*.t"
      - "**/*puncturing*.t"
      - "**/*dm-mapper*.t"
      - "**/*dataelement*.t"
      - "**/*process-manager*.t"
      - "wifi/**/*.t"
  # prplos is the implicit remainder; do not add it as a component.

smoke:
  include:
    - "generic/obuspa.t"
    - "generic/obuspa-cellular.t"
    - "generic/ubus-datamodel-list.t"
    - "generic/ubus-datamodel-list-cellular.t"
    - "generic/ulimit.t"
    - "generic/network.t"
    - "generic/busybox.t"
    - "qemu-x86-64/connectivity.t"
    - "qemu-x86-64/reboot.t"

# Tests that require hardware or firmware capabilities unavailable on QEMU.
hw_only:
  include:
    - "generic/acceleration-plan-components/003-amx-pre-test-verify-fail-action.t"
    - "generic/acceleration-plan-components/010-firewall-dhcp.t"
    - "generic/acceleration-plan-components/010-firewall-dhcp_toggle.t"
    - "generic/acceleration-plan-components/040-usb-filter.t"
    - "generic/acceleration-plan-components/095-reboot-service.t"
    - "generic/acceleration-plan-components/105-temperature.t"
    - "generic/acceleration-plan-components/120-buttons.t"
    - "generic/acceleration-plan-components/018-cellular-trusted-elements.t"
    - "generic/acceleration-plan-components/50-cellular-offline.t"
    - "generic/acceleration-plan-components/060-xpon-mock.t"
    - "generic/acceleration-plan-components/110-data-model-mapper.t"
    - "generic/acceleration-plan-components/130-gre-e2e.t"
    - "generic/acceleration-plan-components/130-tr181-gre.t"
    - "generic/acceleration-plan-components/132-tr181-tuntap.t"
    - "generic/acceleration-plan-components/132-tr181-wireguard.t"
    - "generic/acceleration-plan-components/132-wireguard-e2e.t"
    - "generic/acceleration-plan-components/133-ipsec-e2e.t"
    - "generic/acceleration-plan-components/133-tr181-ipsec.t"
    - "generic/acceleration-plan-components/dhcpv4-client-options/018-dhcpv4-client-options.t"
    - "generic/cellular-manager/010-verify-sim-selection.t"
    - "generic/cellular-manager/020-verify-usim-data-elements.t"
    - "generic/cellular-manager/045-verify-roaming-upstream-status.t"
    - "generic/cellular-manager/060-verify-access-point.t"
    - "generic/cellular-manager/070-verify-data-session.t"
    - "generic/cellular-manager/100-bearer-session-disable.t"
    - "generic/cellular-manager/110-access-technology.t"
    - "generic/cellular-manager/120-sms-storage.t"
    - "generic/cellular-manager/130-sms-message-attributes.t"
    - "generic/deviceinfo-firmware-download-failures.t"
    - "generic/sysupgrade-prpl-download-failure.t"

# post/** is invoked separately for every component job and is not bucketed.

