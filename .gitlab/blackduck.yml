.blackduck scan config:
  extends: .build test config
  stage: blackduck
  timeout: 4 hours
  needs: []
  rules:
    - if: $CI_COMMIT_REF_PROTECTED && $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"
      when: manual
  before_script:
    - touch .build_failed
    - export CI_BUILD_PROFILE="$(echo $CI_JOB_NAME | sed 's/blackduck scan \(.*\)/\1/')"
  script:
    - !reference [.build test config, script]
    - target_name=$(sed -n 's/.*CONFIG_TARGET_BOARD="\([^"]\+\)".*/\1/p' .config)
    - sudo apt update
    - sudo apt install openjdk-17-jdk -y
    - curl -s --output detect.sh https://detect.blackduck.com/detect10.sh
    - sudo chmod +x detect.sh
    - cd build_dir/target-*
    - |
      for dir in $(ls -d build_dir/target-*/*); do
        ./detect.sh --blackduck.url=https://prplfoundation.app.blackduck.com --blackduck.api.token=$BLACKDUCK_API_KEY --detect.project.name=prplos --detect.project.version.name=$CI_COMMIT_REF_NAME-$target_name --detect.source.path=$dir --detect.excluded.detector.types=PIP,NPM

      done
