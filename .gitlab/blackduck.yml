.blackduck scan config:
  extends: .build test config
  stage: blackduck
  timeout: 4 hours
  needs: []
  rules:
    - if: $CI_COMMIT_REF_PROTECTED && $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /ci::allow-expensive-jobs/'
  before_script:
    - touch .build_failed
    - export CI_BUILD_PROFILE="$(echo $CI_JOB_NAME | sed 's/blackduck scan \(.*\)/\1/')"
    - mkdir -p logs
  script:
    - !reference [.build test config, script]
    - target_name=$(sed -n 's/.*CONFIG_TARGET_BOARD="\([^"]\+\)".*/\1/p' .config)
    - sudo apt update
    - sudo apt install openjdk-17-jdk -y
    - curl -s --output detect.sh https://detect.blackduck.com/detect10.sh
    - sudo chmod +x detect.sh
    - |
      for dir in $(ls -d build_dir/target-*/* | grep -v '/toolchain$'); do
        ./detect.sh \
          --blackduck.url=https://prplfoundation.app.blackduck.com \
          --blackduck.api.token=$BLACKDUCK_API_KEY \
          --detect.project.name=prplware-v5 \
          --detect.project.version.name=prplware-v5.0.0-$target_name \
          --detect.source.path=$dir \
          --detect.excluded.detector.types=PIP,NPM \
          --detect.cleanup=false 2>&1 | tee logs/blackduck_$(basename $dir).log || \
          echo "WARNING: scan failed for $dir, continuing"
        rm -rf /home/builder/blackduck/runs/
      done
  after_script:
    - mkdir -p bin
    - tar -czf bin/blackduck-scan-output.tar.gz logs/blackduck_*.log 2>/dev/null || true
