prplMesh-Smoke-test-R1:
  stage: easymesh smoke
  variables:
    RUN_ON_DEVICE: "haze"
    EASYMESH_REVISION: "R1"
    EASYMESH_TESTS_SIMPLE: "MAP-4.4.2_BHWIFI_FH5GH"
    EASYMESH_TESTS_MULTIPLE: "MAP-4.2.1 MAP-4.2.2_BH5GL MAP-4.4.2_BHWIFI_FH5GH MAP-4.5.1_BHWIFI MAP-4.7.3_ETH"
  interruptible: false
  allow_failure: true
  timeout: 80min
  script:
    - |
      TXT_RED="\e[31m" && TXT_PRPL="\e[35m" && TXT_CLEAR="\e[0m"
      TARGET_BRANCH="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-$CI_DEFAULT_BRANCH}"
      echo -e "${TXT_RED}Target branch is: $TARGET_BRANCH${TXT_CLEAR}"
      git fetch origin "$TARGET_BRANCH"
      git diff -U1 "$CI_COMMIT_SHA".."$TARGET_BRANCH" -- profiles/prpl.yml |grep -q -e "feed-prplmesh" -e "feed-amx" || FEED_UNCHANGED=1
      if [ -z $FEED_UNCHANGED ]; then
          echo -e "${TXT_RED}Executing MULTIPLE Easymesh smoke tests since feed-prplmesh or feed-amx is CHANGED compared to $TARGET_BRANCH"
          EASYMESH_TESTS=$EASYMESH_TESTS_MULTIPLE
      else
          echo -e "${TXT_RED}Executing simple Easymesh smoke tests since feed-prplmesh or feed-amx is unchanged compared to $TARGET_BRANCH"
          EASYMESH_TESTS=$EASYMESH_TESTS_SIMPLE
      fi
      echo -e "${TXT_RED}Executing Easymesh tests: ${TXT_PRPL}$EASYMESH_TESTS${TXT_CLEAR}"
    - mkdir -p build/haze/
    - cp bin/targets/ipq807x/generic/prplos-ipq807x-generic-prpl_haze-squashfs-sysupgrade.bin build/haze/prplos-ipq807x-generic-prpl_haze-squashfs-sysupgrade.bin
    - .gitlab/scripts/prplMesh/deploy_firmware.py --device "$RUN_ON_DEVICE" --full --target-name "$RUN_ON_DEVICE" --image "prplos-ipq807x-generic-prpl_haze-squashfs-sysupgrade.bin" --whm --configuration ".gitlab/scripts/prplMesh/dut-configuration/R1/haze.sh"
    - .gitlab/scripts/prplMesh/git-clean-reset.sh ~/easymesh_cert "$(<".gitlab/scripts/prplMesh/easymesh_cert_version")"
    - ~/easymesh_cert/run_test_file.py --verbose --log-folder logs --easymesh-revision "$EASYMESH_REVISION" --device-under-test $RUN_ON_DEVICE "$EASYMESH_TESTS"
  after_script:
    - .gitlab/scripts/prplMesh/R1_marvell_station.sh
  needs:
    - job: build test ipq807x prpl security
      optional: true
  rules:
    - when: always
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  artifacts:
    paths:
      - logs
    when: always
  tags:
    - dut-prplmesh-haze
    - prplmesh-R1


