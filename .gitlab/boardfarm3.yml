#
# The boardfarm3 job of the OSPv2 on testbed-04, and its labgrid baseline:
# the cram job of the same board with the same cram component, on the same
# firmware. Both take the firmware from the build job of pipeline
# FW_PIPELINE_ID, so their cram results can be compared.
#
# Start the boardfarm3 job:
#   glab ci run -b <branch> --variables BF3_RUN:1,FW_PIPELINE_ID:<id>
# Start the baseline job:
#   glab ci run -b <branch> --variables LG_BASELINE_RUN:1,FW_PIPELINE_ID:<id>
# Both jobs wait for a manual start.

.ospv2 firmware from pipeline:
  variables:
    COMPONENT: prplos
    CRAM_COMPONENTS: prplos
    FW_BUILD_JOB_NAME: "build test mxl_x86_osp_tb341_v2 mxl_wlan_hostap_ng_wav700 prpl cellular security thread"

boardfarm3 OSPv2:
  extends:
    - .mxl25641-hdk-6 testbed
    - .ospv2 firmware from pipeline
    - .testbed-bf3
  timeout: 89 minutes
  tags:
    - dut-mxl25641-hdk-6-b-sfl-04
  variables:
    BF3_BOARD_NAME: testbed-04-ospv2
    BF3_INVENTORY: .testbed/boardfarm3/testbed-04.json
    BF3_ENVIRONMENT: .testbed/boardfarm3/mxl25641-hdk-6.json

cram OSPv2 [baseline]:
  extends:
    - .mxl25641-hdk-6 testbed
    - .ospv2 firmware from pipeline
  needs: []
  timeout: 89 minutes
  tags:
    - dut-mxl25641-hdk-6-b-sfl-04
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "latest-24.10"'
      when: never
    - if: '$LG_BASELINE_RUN == "1" && $CI_COMMIT_BRANCH'
      when: manual
    - when: never
  before_script:
    - test -n "$FW_PIPELINE_ID" || { echo "FW_PIPELINE_ID is empty" >&2; exit 1; }
    - .gitlab/scripts/firmware-from-pipeline.sh "$TFTP_IMAGE_PATH" $TFTP_IMAGE_FILENAMES
    - !reference [.testbed, before_script]
