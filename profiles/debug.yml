---
description: Debugging tools and features

additional_packages:
  - feed: packages
    packages:
      - pciids
      - pciutils
      - usbids
      - usbutils

packages:
  - ethtool-full
  - gdb
  - gdbserver
  - strace
  - tcpdump
  - wpa-cli

diffconfig: |
  CONFIG_BUSYBOX_DEFAULT_FEATURE_REVERSE_SEARCH=y
  CONFIG_BUSYBOX_DEFAULT_HUSH_SAVEHISTORY=y
  CONFIG_BUILD_LOG=y
  CONFIG_WPA_MSG_MIN_PRIORITY=0

