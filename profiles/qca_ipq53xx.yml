---
profiles:
  - qcom_rdp441
  - qcom_rdp484
target: ipq53xx
subtarget: generic
external_target: True
description: Build image for prpl Foundation Freedom board
feeds:
  - name: feed_qca
    uri: https://gitlab.com/prpl-foundation/prplOS/feed-qca.git
    tracking_branch: dev/ath12.5-ipq95xx
    revision: 3099438722fc54de42df00a1c7f10c99e0837a9b

additional_packages:
  - feed: packages
    packages:
      - i2c-tools
      - sysstat

packages:
  - ipq53xx
  - wireless-regdb
  - hostapd-qca-utils
  - qca-ssdk-shell
  - wireless-freedom
  - mod-whm-qca-ipq95xx
  - kmod-usb-phy-ipq807x
  - kmod-usb-dwc3-internal
  - kmod-usb-dwc3-qcom-internal
  - kmod-usb-storage
  - kmod-usb-storage-extras
  - kmod-usb-storage-uas
  - kmod-fs-vfat
  - kmod-telemetry-agent
  - wpa-qca-cli
  - ethtool
  - tcpdump
  - taskset

diffconfig: |
  CONFIG_TARGET_INITRAMFS_COMPRESSION_LZMA=y
  CONFIG_BUSYBOX_CUSTOM=y
  CONFIG_BUSYBOX_CONFIG_USLEEP=y
  CONFIG_BUSYBOX_CONFIG_BLOCKDEV=y
  CONFIG_BUSYBOX_CONFIG_TFTPD=y
  CONFIG_BUSYBOX_CONFIG_FEATURE_TFTP_GET=y
  CONFIG_BUSYBOX_CONFIG_FEATURE_TFTP_PUT=y
  CONFIG_BUSYBOX_CONFIG_TFTP=y
  CONFIG_BUSYBOX_CONFIG_TELNET=y
