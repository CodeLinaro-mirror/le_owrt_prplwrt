diffconfig: |
  CONFIG_DEVEL=y
  CONFIG_EXTRA_OPTIMIZATION="-fno-caller-saves -fno-plt -Wno-error=deprecated-declarations -Wno-error=address"
  CONFIG_KERNEL_GIT_CLONE_URI="https://github.com/maxlinear/linux.git"
  CONFIG_KERNEL_GIT_REF="UPDK_9.2.12"
  CONFIG_GPON_OMCI_ONU_UBUS_INTERFACE=y
  CONFIG_TARGET_MULTI_PROFILE=y
  CONFIG_TARGET_PER_DEVICE_ROOTFS=y
  CONFIG_TARGET_DEVICE_intel_x86_lgm_DEVICE_PRPL_OSP_v2=y
  # CONFIG_TARGET_ROOTFS_EXT4FS is not set
  CONFIG_BUILD_LOG=y
  CONFIG_PACKAGE_uboot-octopus-urx641-overlay-fit-p34x-phy-emmc-prpl=y
  CONFIG_PACKAGE_uboot-octopus-urx641-4GB-ddr-overlay-fit-p34x-phy-emmc-prpl=y
  CONFIG_VERSION_FILENAMES=n
  CONFIG_VERSION_CODE_FILENAMES=n
  # CONFIG_PACKAGE_bios_images is not set
  CONFIG_BUILD_SDK="prplos"
  CONFIG_BUSYBOX_CUSTOM=y
  CONFIG_BUSYBOX_CONFIG_TFTPD=y
  CONFIG_BUSYBOX_CONFIG_FEATURE_TFTP_GET=y
  CONFIG_BUSYBOX_CONFIG_FEATURE_TFTP_PUT=y
  CONFIG_BUSYBOX_CONFIG_TFTP=y
  CONFIG_LGM_EIP123_SUPPORT=y
  CONFIG_KERNEL_FTRACE=y
  CONFIG_IMAGEGENERATOR_BOARD="tb341_wav700"
  CONFIG_SAH_LIB_MFG_RO_PART_FILE="/dev/mmcblk0p13"
  CONFIG_SECURESTORE_LABEL="config"
  CONFIG_FWI_FLASH_PARTITIONS="u-boot,kernel"
  CONFIG_SWUPDATE_TARGET_HW_VERSION="ospv2:1.0"
  # tr181-barometer has auto-discovery mode, where it discovers the iio path automatically. 
  # Explicitly, the path can be configured using below build configurations.
  # CONFIG_AMX_TR181_BAROMETER_IIO_PATH="/sys/bus/iio/devices/iio:device0"
  # CONFIG_AMX_TR181_BAROMETER_VERTICAL_UNCERTAINTY="2.49"
  # CONFIG_AMX_TR181_BAROMETER_PRESSURE_ACCURACY_PA="30"
  CONFIG_AMX_TR181_GPS_DEVICE="/dev/ttyLTQ1"
  CONFIG_AMX_TR181_GPS_BAUDRATE="921600"
