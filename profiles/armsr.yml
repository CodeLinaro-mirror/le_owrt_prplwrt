---
profiles:
  - generic
target: armsr
subtarget: armv8
description: Build image for armsr/armv8 generic target

packages:
  - hostapd-utils
  - iw-full
  - kmod-button-hotplug
  - kmod-mac80211-hwsim
  - mod-fwi-swupdate
  - sysupgrade-prpl
  - swupdate
  - wpad-basic

diffconfig: |
  # The single-rootfs EFI image has no swappable firmware bank pair.
  # Negative download tests return before flash or partition activation.
  CONFIG_FWI_FLASH_PARTITIONS="rootfs"
  CONFIG_SWUPDATE_TARGET_HW_VERSION="qemu-armsr-armv8:1.0"
  CONFIG_OPENSOURCE_SWUPDATE_EXT_FILESYSTEM=y
  CONFIG_OPENSOURCE_SWUPDATE_DISKPART_HANDLER=y
  CONFIG_OPENSOURCE_SWUPDATE_DISKFORMAT_HANDLER=y
  CONFIG_GRUB_TIMEOUT="1"
  # CONFIG_TARGET_IMAGES_GZIP is not set
  CONFIG_TARGET_ROOTFS_PARTSIZE=192
  CONFIG_TARGET_INITRAMFS_COMPRESSION_LZMA=y
  CONFIG_TARGET_ROOTFS_INITRAMFS=y
  CONFIG_TESTING_KERNEL=y
