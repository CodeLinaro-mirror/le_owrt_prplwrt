---
profiles:
  - prpl_freedom
target: ipq95xx
subtarget: generic
external_target: True
description: Build image for prpl Foundation Freedom board
feeds:
  - name: feed_qca
    uri: https://gitlab.com/prpl-foundation/prplOS/feed-qca.git
    branch: FEAT-29
  - name: feed_swupdate
    uri: https://gitlab.com/prpl-foundation/prplos/feeds/feed_swupdate.git
    branch: dev_FEAT-29

packages:
  - ipq95xx
  - wireless-regdb
  - hostapd-qca-utils
  - wpa-qca-cli
  - ath12k-caldata
  - aq-fw-download
  - aq_phy
  - qca-ssdk-shell
  - efr32-boot-config
  - wireless-freedom
  - kmod-usb-phy-ipq807x
  - kmod-usb-dwc3-internal
  - kmod-usb-dwc3-qcom-internal
  - kmod-usb-storage
  - kmod-usb-storage-extras
  - kmod-usb-storage-uas
  - kmod-fs-vfat
  - kmod-telemetry-agent
  - kmod-i2c-mux-pca954x
  - kmod-gpio-pca953x
  - kmod-leds-lp5562
  - freedom-lcm-partitioner
  - kmod-qca8084
  - kmod-qca81xx
  - kmod-qca8xxx-phc
  - kmod-ppp
  - kmod-pppoe
  - kmod-ath11k
  - kmod-qca-nss-pppoe-mgr
  - kmod-qca-nss-gre-mgr
  - ppecfg
  - taskset
  - kmod-qca-nss-ppe-pppoe-mgr
  - kmod-qca-nss-ppe-gre-mgr
  - kmod-qca-mdio
  - kmod-qca-nss-ppe-ath-clients
  - kmod-qca-wifi-nss-plugins
  - wifi-scripts
  - wifi-helper-scripts
  - swupdate
  - libubootenv
  - imagegenerator
  - initramfs-generator
  - libblkid
  - libuuid
  - libcomerr
  - libext2fs
  - libfdisk
  - blkid
  - libfdt
  - fdt-utils
  - kmod-dm

diffconfig: |
  CONFIG_BUSYBOX_CUSTOM=y
  CONFIG_BUSYBOX_CONFIG_I2CSET=y
  CONFIG_PACKAGE_ATH_DEBUG=y
  # CONFIG_PACKAGE_wififw_mount_script is not set
  # CONFIG_KERNEL_SWAP is not set
  CONFIG_PACKAGE_ppecfg=y
  CONFIG_PACKAGE_libnl-ppe=y
  CONFIG_PACKAGE_kmod-qseecom=m
  CONFIG_BUSYBOX_CONFIG_DEVMEM=y
  CONFIG_EXTERNAL_CPIO=""
  CONFIG_TARGET_SECURE_INITRAMFS=y
  CONFIG_TARGET_SECURE_INITRAMFS_COMPRESSION_GZIP=y
  CONFIG_INITRAMFS_GENERATOR_DEBUG=y
  CONFIG_INITRAMFS_GENERATOR_FLASH_TYPE_EMMC=y
  CONFIG_INITRAMFS_GENERATOR_ROOTFS_SIG_PRELOAD=y
  CONFIG_INITRAMFS_GENERATOR_ROOTFS_SIG_PRELOAD_MANDATORY=y
  CONFIG_IMAGEGENERATOR_BOARD="qca_ipq95xx_freedom"
  CONFIG_OPENSOURCE_SWUPDATE_EXT_FILESYSTEM=y
  CONFIG_OPENSOURCE_SWUPDATE_DISKPART_HANDLER=y
  CONFIG_OPENSOURCE_SWUPDATE_DISKFORMAT_HANDLER=y
  CONFIG_BUSYBOX_CONFIG_BLKID=y
  CONFIG_BUSYBOX_CONFIG_BLOCKDEV=y
  CONFIG_INITRAMFS_GENERATOR_ROOTFS_SIG_PRELOAD=y
  CONFIG_BUSYBOX_CONFIG_MODPROBE=y
  CONFIG_KERNEL_DEVTMPFS=y
  # CONFIG_TARGET_ROOTFS_INITRAMFS is not set
  CONFIG_BUSYBOX_CONFIG_LOSETUP=y
  CONFIG_BUSYBOX_CONFIG_STAT=y
  BUSYBOX_CONFIG_FEATURE_STAT_FORMAT=y
  BUSYBOX_CONFIG_FEATURE_STAT_FILESYSTEM=y
  CONFIG_SAH_LIB_MFG_RO_PART_FILE="/dev/mmcblk0p32"
  CONFIG_IMAGEGENERATOR=y
  CONFIG_SAH_LIB_MFG_GLOBAL_SIGNATURE=y
  CONFIG_SAH_LIB_MFG_GLOBAL_SIGNATURE_PUBLIC_PEM_FILE="/security/smd_pub.pem"
  CONFIG_SAH_LIB_MFG_SECURE_MFG_KERNEL_KEYRING_SUPPORT=y
  CONFIG_SAH_LIB_MFG_SECURE_MFG_KERNEL_KEYRING_KEY_NAME="mfg:Kuk"
  CONFIG_SAH_LIB_MFG_SECURE_MFG_KERNEL_KEYRING_IV_FILE="/rom/security/initramfs/Kuk-aes-iv.hex"
