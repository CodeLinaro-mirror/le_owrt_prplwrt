---
profiles:
  - prpl_freedom
target: ipq95xx
subtarget: generic
external_target: True
description: Build image for prpl Foundation Freedom board
feeds:
  - name: feed_qca
    uri: https://gitlab.com/prpl-foundation/prplOS/feed-qca.git
    tracking_branch: marvin/enable-mlo-support
    revision: 18c103c1c5869d8a669c3b0a0f9c798928a9e328

packages:
  - ipq95xx
  - wireless-regdb
  - hostapd-qca-utils
  - ath12k-wifi-qcom-qcn92xx
  - ath12k-caldata
  - aq-fw-download
  - aq_phy
  - qca-ssdk-shell
  - io-expander-freedom
  - wireless-freedom
  - mod-whm-qca-ipq95xx
  - kmod-usb-phy-ipq807x
  - kmod-usb-dwc3-internal
  - kmod-usb-dwc3-qcom-internal
  - kmod-usb-storage
  - kmod-usb-storage-extras
  - kmod-usb-storage-uas
  - kmod-fs-vfat
  - kmod-telemetry-agent

diffconfig: |
  CONFIG_TARGET_INITRAMFS_COMPRESSION_LZMA=y
  CONFIG_BUSYBOX_CUSTOM=y
  CONFIG_BUSYBOX_CONFIG_I2CSET=y
