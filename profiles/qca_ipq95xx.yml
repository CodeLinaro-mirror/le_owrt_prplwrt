  - ath12k-caldata
  - aq-fw-download
  - aq_phy
  - qca-ssdk-shell
  - io-expander-freedom
  - mod-whm-qca-ipq95xx
  - kmod-usb-phy-ipq807x
  - kmod-usb-dwc3-internal
