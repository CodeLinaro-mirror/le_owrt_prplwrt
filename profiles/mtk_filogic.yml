---
profiles:
  - arcadyan_mozart
target: mediatek
subtarget: filogic
external_target: True
description: Build image for MediaTek / Arcadyan Mozart board
feeds:
  - name: feed_mediatek
    uri: https://gitlab.com/prpl-foundation/prplos/feeds/feed-mediatek.git
    tracking_branch: arcadyan-mozart-v2
    revision: b3f4e979b82c607368f4ee1360027321ab2a5d2b
  - name: feed_prplos
    uri: https://gitlab.com/prpl-foundation/prplos/feeds/feed-prplos.git
    tracking_branch: arcadyan-mozart
    revision: 981bbfb834af81ef928f63259486a45979467f2c
  - name: feed_mfg
    uri: https://gitlab.com/prpl-foundation/prplos/feeds/feed_mfg.git
    tracking_branch: master
    revision: 610b8b614af86e0d69446efb75cfa938412963c8

additional_packages:
  - feed: packages
    packages:
      - cryptsetup

packages:
  - mediatek
  - kmod-mt7996-firmware
  - kmod-mt7996-233-firmware
  - kmod-mt7996e
  - kmod-br-netfilter
  - kmod-ipt-offload
  - kmod-reset-boot-count
  - ucode-mod-uci
  - netifd
  - wifi-scripts
  - wpa-cli
  - hostapd-utils
  - libudebug
  - iptables
  - iptables-mod-conntrack-extra
  - iptables-mod-extra
  - iptables-mod-ipopt
  - mtkhnat_util
  - mt7988-wo-firmware
  - u-boot-mt7988_arcadyan_mozart
  - aqr10g-phy-firmware
  - mt798x-2p5g-phy-firmware-internal
  - smp_util
  - regs
  - mii_mgr
  - switch
  - ephy-utils
  - mt76-test
  - tcpdump
  - mpstat
  - tftp
  - wifi_shutdown_util
  - netfilter-flowtable
  - libmfg
  - readmfg
  - afcd
  - atenl

diffconfig: |
  CONFIG_TARGET_ROOTFS_PARTSIZE=256
  CONFIG_TARGET_MULTI_PROFILE=y
  CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_mediatek_mt7988a-rfb=y
  CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_mediatek_mt7988d-rfb=y
  CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_arcadyan_mozart=y
  # CONFIG_PACKAGE_trusted-firmware-a-mt7981-ram-ddr3 is not set
  # CONFIG_PACKAGE_trusted-firmware-a-mt7981-ram-ddr4 is not set
  # CONFIG_PACKAGE_trusted-firmware-a-mt7986-ram-ddr3 is not set
  # CONFIG_PACKAGE_trusted-firmware-a-mt7986-ram-ddr4 is not set
  # CONFIG_PACKAGE_trusted-firmware-a-mt7988-ram-comb is not set
  CONFIG_PACKAGE_CFG80211_TESTMODE=y
  CONFIG_WPA_MSG_MIN_PRIORITY=0
  # CONFIG_PACKAGE_wpad-basic-mbedtls is not set
  # CONFIG_PACKAGE_wpad-openssl is not set
  CONFIG_BUSYBOX_CONFIG_DEVMEM=y
  CONFIG_PACKAGE_kmod-mii=y
  CONFIG_PACKAGE_kmod-usb2=y
  CONFIG_PACKAGE_kmod-usb3=y
  CONFIG_PACKAGE_kmod-usb-core=y
  CONFIG_PACKAGE_kmod-usb-ehci=y
  CONFIG_PACKAGE_kmod-usb-net-cdc-eem=y
  CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
  CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y
  CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
  CONFIG_PACKAGE_kmod-usb-net-cdc-subset=y
  CONFIG_PACKAGE_kmod-usb-net-huawei-cdc-ncm=y
  CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
  CONFIG_PACKAGE_kmod-usb-net=y
  CONFIG_PACKAGE_kmod-usb-ohci=y
  CONFIG_PACKAGE_kmod-usb-serial-option=y
  CONFIG_PACKAGE_kmod-usb-serial-qualcomm=y
  CONFIG_PACKAGE_kmod-usb-serial-wwan=y
  CONFIG_PACKAGE_kmod-usb-serial=y
  CONFIG_PACKAGE_kmod-usb-storage-extras=y
  CONFIG_PACKAGE_kmod-usb-storage-uas=y
  CONFIG_PACKAGE_kmod-usb-storage=y
  CONFIG_PACKAGE_kmod-usb-uhci=y
  CONFIG_PACKAGE_kmod-usb-wdm=y
  CONFIG_PACKAGE_kmod-usb-xhci-hcd=y
  CONFIG_PACKAGE_kmod-usb-xhci-mtk=y
  CONFIG_PACKAGE_kmod-wwan=y
  CONFIG_PACKAGE_kmod-nls-base=y
  CONFIG_PACKAGE_kmod-scsi-core=y
  CONFIG_PACKAGE_kmod-i2c-algo-bit=y
  CONFIG_PACKAGE_kmod-i2c-core=y
  CONFIG_PACKAGE_kmod-i2c-gpio=y
