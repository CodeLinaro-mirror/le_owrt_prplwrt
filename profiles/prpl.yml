  - prplmesh
  - rlyeh
  - routing-manager
  - tc
  - time-manager
  - timingila
  - timingila-cthulhu
  - timingila-rlyeh
  - tr069-manager
  - tr181-bridging
  - tr181-device
  - tr181-dhcpv4client
  - tr181-dhcpv6client
  - tr181-firewall
  - tr181-qos
  - tr181-rest-api
  - tr181-usermanagement
