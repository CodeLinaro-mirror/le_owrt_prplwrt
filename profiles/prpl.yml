---
description: Add the prpl features
feeds:
  - name: feed_prpl
    uri: https://gitlab.com/prpl-foundation/prplOS/feed-prpl.git
    tracking_branch: prplos-next
    revision: 23e3956ea110db31227900127e262a612433d656

additional_packages:
  - feed: packages
    packages:
      - chrony
      - libnl-core
      - libnl-route
      - lighttpd
      - lighttpd-mod-fastcgi
      - lighttpd-mod-auth
      - lighttpd-mod-authn_file
      - syslog-ng

packages:
  - acl-manager
  - amx-cli
  - cthulhu
  - cthulhu-lxc
  - deviceinfo-manager
  - dhcpv4-manager
  - dhcpv6s-manager
  - ethernet-manager
  - ip-manager
  - iptables-mod-ipopt
  - libdhcpoptions
  - libfwinterface
  - libfwrules
  - libnetmodel
  - lxc
  - lxc-attach
  - lxc-auto
  - lxc-autostart
  - lxc-cgroup
  - lxc-checkconfig
  - lxc-common
  - lxc-config
  - lxc-configs
  - lxc-console
  - lxc-copy
  - lxc-create
  - lxc-destroy
  - lxc-device
  - lxc-execute
  - lxc-freeze
  - lxc-hooks
  - lxc-info
  - lxc-ls
  - lxc-monitor
  - lxc-start
  - lxc-stop
  - lxc-templates
  - lxc-top
  - lxc-unfreeze
  - lxc-unprivileged
  - lxc-unshare
  - lxc-user-nic
  - lxc-usernsexec
  - lxc-wait
